<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giggle OS</title>
    <style>
      :root {
        --bg-1: #0a4d7a;
        --bg-2: #1c7ea8;
        --win98-bg: #c0c0c0;
        --win98-panel: #d4d0c8;
        --win98-light: #ffffff;
        --win98-shadow: #808080;
        --win98-dark: #404040;
        --win98-blue: #000080;
        --win98-green: #008080;
        --taskbar-h: 42px;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "MS Sans Serif", Tahoma, sans-serif;
        background: var(--bg-1);
      }

      body {
        background:
          linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.06)),
          linear-gradient(135deg, #0a4d7a 0%, #2f8ec0 25%, #5db4d7 45%, #4a90b5 100%);
      }

      #desktop {
        position: relative;
        width: 100%;
        height: calc(100% - var(--taskbar-h));
        overflow: hidden;
      }

      #desktop::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.08)),
          repeating-linear-gradient(
            to right,
            rgba(255,255,255,0.04) 0,
            rgba(255,255,255,0.04) 2px,
            rgba(0,0,0,0.02) 2px,
            rgba(0,0,0,0.02) 4px
          );
        pointer-events: none;
      }

      .desktop-icons {
        position: absolute;
        inset: 12px auto auto 12px;
        width: 120px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 1;
      }

      .desktop-icon {
        width: 86px;
        background: transparent;
        border: none;
        color: #fff;
        text-shadow: 1px 1px 1px rgba(0,0,0,.75);
        cursor: pointer;
        text-align: center;
        padding: 4px 3px;
        font-size: 12px;
      }

      .desktop-icon:focus,
      .desktop-icon:hover {
        outline: 1px dotted rgba(255,255,255,.95);
        outline-offset: 0;
      }

      .desktop-icon .icon {
        width: 42px;
        height: 42px;
        margin: 0 auto 6px;
        display: grid;
        place-items: center;
        font-size: 28px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.18);
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18);
      }

      .desktop-icon .label {
        display: block;
        line-height: 1.2;
      }

      .window-layer {
        position: absolute;
        inset: 0;
        z-index: 2;
      }

      .window {
        position: absolute;
        display: flex;
        flex-direction: column;
        background: var(--win98-panel);
        border: 2px solid;
        border-color: var(--win98-light) var(--win98-shadow) var(--win98-shadow) var(--win98-light);
        box-shadow: 3px 3px 0 rgba(0,0,0,0.35);
        min-width: 260px;
        min-height: 160px;
      }

      .window.active {
        box-shadow: 5px 5px 0 rgba(0,0,0,0.4);
      }

      .window-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(90deg, #000080, #1084d0);
        color: #fff;
        height: 22px;
        padding: 2px 4px 2px 6px;
        cursor: move;
        user-select: none;
      }

      .window-title {
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .window-controls {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .window-button {
        position: relative;
        width: 18px;
        height: 18px;
        border: 2px solid;
        border-color: var(--win98-light) var(--win98-shadow) var(--win98-shadow) var(--win98-light);
        background: var(--win98-bg);
        color: #000;
        display: grid;
        place-items: center;
        font-weight: 700;
        cursor: pointer;
        padding: 0;
        line-height: 1;
      }

      .window-button:active {
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
      }

      .window-body {
        flex: 1;
        min-height: 0;
        padding: 4px;
        background: var(--win98-panel);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 2px solid;
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
        background: #fff;
      }

      .resize-handle {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 16px;
        height: 16px;
        cursor: nwse-resize;
        background: linear-gradient(135deg, #c0c0c0 0%, #c0c0c0 50%, #808080 50%, #808080 100%);
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
      }

      #taskbar {
        position: relative;
        height: var(--taskbar-h);
        background: var(--win98-bg);
        border-top: 2px solid var(--win98-light);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 6px;
        z-index: 100;
      }

      #start-button {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        padding: 0 12px 0 8px;
        background: var(--win98-bg);
        border: 2px solid;
        border-color: var(--win98-light) var(--win98-shadow) var(--win98-shadow) var(--win98-light);
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }

      #start-button:active {
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
      }

      #start-button .logo {
        width: 16px;
        height: 16px;
        background: linear-gradient(135deg, #ff2d2d, #a80000);
        position: relative;
        display: inline-block;
        border: 1px solid #000;
      }

      #start-button .logo::before {
        content: "";
        position: absolute;
        inset: 3px;
        background: linear-gradient(135deg, #fff, #dfe5eb);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 25% 100%, 0 80%);
      }

      #start-menu {
        position: absolute;
        left: 8px;
        bottom: 42px;
        width: 220px;
        background: var(--win98-bg);
        border: 2px solid;
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
        display: none;
        box-shadow: 3px 3px 0 rgba(0,0,0,0.35);
      }

      #start-menu.open {
        display: block;
      }

      #start-menu-inner {
        display: flex;
        min-height: 220px;
      }

      .brand {
        width: 28px;
        background: linear-gradient(180deg, #7a7a7a, #c5c5c5);
        color: #fff;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        letter-spacing: 1px;
        text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
        border-right: 2px solid #6a6a6a;
      }

      #start-menu-list {
        flex: 1;
        list-style: none;
        padding: 4px;
        margin: 0;
        background: var(--win98-panel);
      }

      #start-menu-list li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        font-size: 12px;
        cursor: pointer;
        border: 1px solid transparent;
      }

      #start-menu-list li:hover {
        background: var(--win98-blue);
        color: #fff;
      }

      #taskbar-window-list {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 4px;
        overflow: hidden;
        min-width: 0;
      }

      .taskbar-item {
        max-width: 170px;
        min-width: 90px;
        height: 30px;
        border: 2px solid;
        border-color: var(--win98-light) var(--win98-shadow) var(--win98-shadow) var(--win98-light);
        background: var(--win98-bg);
        display: flex;
        align-items: center;
        padding: 4px 8px;
        font-size: 12px;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .taskbar-item.active {
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
        background: #d0d0d0;
      }

      #clock {
        width: 92px;
        min-width: 92px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        border: 2px solid;
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
        background: var(--win98-panel);
      }

      .context-menu {
        position: absolute;
        z-index: 300;
        min-width: 140px;
        background: var(--win98-bg);
        border: 2px solid;
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
        box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
        display: none;
      }

      .context-menu.open {
        display: block;
      }

      .context-menu-item {
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }

      .context-menu-item:hover {
        background: var(--win98-blue);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="desktop">
      <div id="desktop-icons" class="desktop-icons"></div>
      <div id="window-layer" class="window-layer"></div>
      <div id="context-menu" class="context-menu" aria-label="Desktop menu"></div>
    </div>

    <div id="taskbar">
      <button id="start-button" type="button" aria-expanded="false">
        <span class="logo" aria-hidden="true"></span>
        <span>Start</span>
      </button>

      <div id="start-menu" aria-label="Start menu">
        <div id="start-menu-inner">
          <div class="brand">Giggle OS</div>
          <ul id="start-menu-list"></ul>
        </div>
      </div>

      <div id="taskbar-window-list"></div>
      <div id="clock">--:--</div>
    </div>

    <script>
      const apps = [
        { name: 'EReader', file: 'Apps/EReader.html', icon: '📖', category: 'Read' },
        { name: 'LocalMind', file: 'Apps/LocalMind.html', icon: '🧠', category: 'Tools' },
        { name: 'MusiMobile', file: 'Apps/MusiMobile.html', icon: '🎵', category: 'Media' },
        { name: 'NotePlate', file: 'Apps/NotePlate.html', icon: '📝', category: 'Write' },
        { name: 'Youtube', file: 'Apps/Youtube.html', icon: '🎬', category: 'Media' },
        { name: 'asciispace', file: 'Apps/asciispace.html', icon: '🚀', category: 'Games' },
        { name: 'captaincallisto', file: 'Apps/captaincallisto.html', icon: '🪐', category: 'Games' },
        { name: 'chromedino', file: 'Apps/chromedino.html', icon: '🦖', category: 'Games' },
        { name: 'haven', file: 'Apps/haven.html', icon: '🏕️', category: 'Apps' },
        { name: 'offlineparadise', file: 'Apps/offlineparadise.html', icon: '🌴', category: 'Apps' },
        { name: 'packabunchas', file: 'Apps/packabunchas.html', icon: '📦', category: 'Games' },
        { name: 'rokepogue', file: 'Apps/rokepogue.html', icon: '📚', category: 'Read' },
        { name: 'spacehuggers', file: 'Apps/spacehuggers.html', icon: '🌌', category: 'Games' }
      ];

      const desktopIcons = document.getElementById('desktop-icons');
      const startMenuList = document.getElementById('start-menu-list');
      const taskbarWindowList = document.getElementById('taskbar-window-list');
      const windowLayer = document.getElementById('window-layer');
      const startButton = document.getElementById('start-button');
      const startMenu = document.getElementById('start-menu');
      const clockEl = document.getElementById('clock');
      const contextMenu = document.getElementById('context-menu');
      const desktop = document.getElementById('desktop');

      const windowMap = new Map();

      function renderDesktopApps() {
        apps.forEach((app) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'desktop-icon';
          button.setAttribute('aria-label', app.name);
          button.innerHTML = `
            <div class="icon" aria-hidden="true">${app.icon}</div>
            <span class="label">${app.name}</span>
          `;
          button.addEventListener('dblclick', () => openApp(app));
          desktopIcons.appendChild(button);
        });
      }

      function renderStartMenu() {
        apps.forEach((app) => {
          const item = document.createElement('li');
          item.innerHTML = `<span aria-hidden="true">${app.icon}</span><span>${app.name}</span>`;
          item.addEventListener('click', () => {
            openApp(app);
            toggleStartMenu(false);
          });
          startMenuList.appendChild(item);
        });
      }

      function createTaskbarItem(appName) {
        const taskItem = document.createElement('div');
        taskItem.className = 'taskbar-item active';
        taskItem.textContent = appName;
        taskItem.title = appName;
        taskItem.addEventListener('click', () => {
          const targetWindow = [...document.querySelectorAll('.window')].find((win) => win.dataset.app === appName);
          if (targetWindow) focusWindow(targetWindow);
        });
        taskbarWindowList.appendChild(taskItem);
        return taskItem;
      }

      function openApp(app) {
        const existing = document.querySelector(`.window[data-app="${app.name}"]`);
        if (existing) {
          focusWindow(existing);
          return;
        }

        const win = document.createElement('div');
        win.className = 'window active';
        win.dataset.app = app.name;
        win.dataset.windowId = crypto.randomUUID();

        const width = Math.min(window.innerWidth * 0.72, 860);
        const height = Math.min(window.innerHeight * 0.68, 620);
        const left = 80 + (windowMap.size * 24) % Math.max(80, window.innerWidth - width - 120);
        const top = 60 + (windowMap.size * 18) % Math.max(40, window.innerHeight - height - 120);

        win.style.left = `${left}px`;
        win.style.top = `${top}px`;
        win.style.width = `${width}px`;
        win.style.height = `${height}px`;

        const header = document.createElement('div');
        header.className = 'window-header';
        header.innerHTML = `
          <div class="window-title">${app.name}</div>
          <div class="window-controls">
            <button class="window-button" type="button" data-action="minimize" aria-label="Minimize ${app.name}">_</button>
            <button class="window-button" type="button" data-action="maximize" aria-label="Maximize ${app.name}">□</button>
            <button class="window-button" type="button" data-action="close" aria-label="Close ${app.name}">×</button>
          </div>
        `;

        const body = document.createElement('div');
        body.className = 'window-body';

        const frame = document.createElement('iframe');
        frame.src = app.file;
        frame.title = app.name;
        frame.setAttribute('sandbox', 'allow-scripts allow-forms allow-same-origin allow-popups allow-modals');

        body.appendChild(frame);
        win.appendChild(header);
        win.appendChild(body);

        const resizeHandle = document.createElement('div');
        resizeHandle.className = 'resize-handle';
        resizeHandle.title = 'Resize';
        win.appendChild(resizeHandle);

        windowLayer.appendChild(win);

        const taskItem = createTaskbarItem(app.name);
        taskItem.dataset.windowId = win.dataset.windowId;
        win.dataset.taskbarItem = taskItem.dataset.windowId;
        windowMap.set(win.dataset.windowId, { win, taskItem, app });

        let dragging = false;
        let resize = false;
        let startX = 0;
        let startY = 0;
        let originRect = null;

        header.addEventListener('mousedown', (event) => {
          if (event.target.closest('.window-button')) return;
          dragging = true;
          focusWindow(win);
          const rect = win.getBoundingClientRect();
          startX = event.clientX;
          startY = event.clientY;
          originRect = { left: rect.left, top: rect.top };
        });

        resizeHandle.addEventListener('mousedown', (event) => {
          resize = true;
          focusWindow(win);
          startX = event.clientX;
          startY = event.clientY;
          originRect = { width: win.offsetWidth, height: win.offsetHeight };
        });

        document.addEventListener('mousemove', (event) => {
          if (dragging && originRect) {
            const dx = event.clientX - startX;
            const dy = event.clientY - startY;
            const nextLeft = Math.min(Math.max(originRect.left + dx, 0), window.innerWidth - 120);
            const nextTop = Math.min(Math.max(originRect.top + dy, 0), window.innerHeight - 100);
            win.style.left = `${nextLeft}px`;
            win.style.top = `${nextTop}px`;
          }

          if (resize && originRect) {
            const dx = event.clientX - startX;
            const dy = event.clientY - startY;
            const nextWidth = Math.min(Math.max(originRect.width + dx, 260), window.innerWidth - 20);
            const nextHeight = Math.min(Math.max(originRect.height + dy, 180), window.innerHeight - 70);
            win.style.width = `${nextWidth}px`;
            win.style.height = `${nextHeight}px`;
          }
        });

        document.addEventListener('mouseup', () => {
          dragging = false;
          resize = false;
          originRect = null;
        });

        header.querySelector('[data-action="close"]').addEventListener('click', () => closeWindow(win));
        header.querySelector('[data-action="minimize"]').addEventListener('click', () => {
          win.style.display = 'none';
          taskItem.style.opacity = '0.7';
          taskItem.classList.remove('active');
        });
        header.querySelector('[data-action="maximize"]').addEventListener('click', () => {
          if (win.dataset.maximized === 'true') {
            win.dataset.maximized = 'false';
            win.style.left = win.dataset.prevLeft || '80px';
            win.style.top = win.dataset.prevTop || '60px';
            win.style.width = win.dataset.prevWidth || '760px';
            win.style.height = win.dataset.prevHeight || '520px';
          } else {
            win.dataset.prevLeft = win.style.left;
            win.dataset.prevTop = win.style.top;
            win.dataset.prevWidth = win.style.width;
            win.dataset.prevHeight = win.style.height;
            win.dataset.maximized = 'true';
            win.style.left = '0px';
            win.style.top = '0px';
            win.style.width = `${window.innerWidth - 4}px`;
            win.style.height = `${window.innerHeight - 42}px`;
          }
          focusWindow(win);
        });

        win.addEventListener('mousedown', () => focusWindow(win));
        focusWindow(win);
      }

      function focusWindow(win) {
        const allWindows = document.querySelectorAll('.window');
        allWindows.forEach((w) => w.classList.remove('active'));
        win.classList.add('active');

        const taskItems = [...document.querySelectorAll('.taskbar-item')];
        taskItems.forEach((item) => item.classList.remove('active'));

        const currentTask = [...taskItems].find((item) => item.textContent === win.dataset.app);
        if (currentTask) currentTask.classList.add('active');
      }

      function closeWindow(win) {
        const taskItem = [...taskbarWindowList.children].find((item) => item.textContent === win.dataset.app);
        if (taskItem) taskItem.remove();
        win.remove();
        windowMap.delete(win.dataset.windowId);
      }

      function toggleStartMenu(force) {
        const shouldOpen = typeof force === 'boolean' ? force : !startMenu.classList.contains('open');
        startMenu.classList.toggle('open', shouldOpen);
        startButton.setAttribute('aria-expanded', String(shouldOpen));
      }

      function showDesktopMenu(event) {
        event.preventDefault();
        contextMenu.innerHTML = `
          <div class="context-menu-item" data-action="refresh">Refresh</div>
          <div class="context-menu-item" data-action="explorer">Open Apps Folder</div>
        `;

        contextMenu.style.left = `${event.clientX}px`;
        contextMenu.style.top = `${event.clientY}px`;
        contextMenu.classList.add('open');

        contextMenu.querySelector('[data-action="refresh"]').addEventListener('click', () => {
          location.reload();
        });

        contextMenu.querySelector('[data-action="explorer"]').addEventListener('click', () => {
          openApp({ name: 'Apps Folder', file: 'Apps', icon: '📁' });
          contextMenu.classList.remove('open');
        });
      }

      document.addEventListener('contextmenu', (event) => {
        if (event.target.closest('#desktop') && !event.target.closest('.window')) {
          showDesktopMenu(event);
        } else {
          contextMenu.classList.remove('open');
        }
      });

      document.addEventListener('click', (event) => {
        if (!startMenu.contains(event.target) && !startButton.contains(event.target)) {
          toggleStartMenu(false);
        }
        if (!contextMenu.contains(event.target) && !event.target.closest('#desktop')) {
          contextMenu.classList.remove('open');
        }
      });

      startButton.addEventListener('click', () => toggleStartMenu());

      function updateClock() {
        const now = new Date();
        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        clockEl.textContent = timeString;
      }

      renderDesktopApps();
      renderStartMenu();
      updateClock();
      setInterval(updateClock, 30000);
    </script>
  </body>
</html>
