<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giggle OS</title>
    <style>
      :root {
        --desktop-top: #3a7fb0;
        --desktop-mid: #7dbad5;
        --desktop-bottom: #2e7297;
        --win98-bg: #c0c0c0;
        --win98-panel: #d4d0c8;
        --win98-light: #ffffff;
        --win98-shadow: #808080;
        --win98-dark: #404040;
        --win98-blue: #000080;
        --win98-green: #008080;
        --taskbar-h: 42px;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "MS Sans Serif", Tahoma, Verdana, sans-serif;
        background: #000;
      }

      body {
        background: linear-gradient(180deg, #071a28 0%, #0f2b36 18%, #1d5572 100%);
      }

      button, input {
        font: inherit;
      }

      #desktop {
        position: relative;
        width: 100%;
        height: calc(100% - var(--taskbar-h));
        overflow: hidden;
        display: none;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.08)),
          linear-gradient(180deg, var(--desktop-top) 0%, var(--desktop-mid) 36%, var(--desktop-bottom) 100%);
      }

      #desktop::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 20% 15%, rgba(255,255,255,0.2), transparent 22%),
          radial-gradient(circle at 72% 30%, rgba(255,255,255,0.12), transparent 25%),
          repeating-linear-gradient(
            90deg,
            rgba(255,255,255,0.02),
            rgba(255,255,255,0.02) 2px,
            rgba(0,0,0,0.015) 2px,
            rgba(0,0,0,0.015) 4px
          );
        pointer-events: none;
      }

      .desktop-icons {
        position: absolute;
        top: 14px;
        left: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 2;
      }

      .desktop-icon {
        width: 88px;
        background: transparent;
        border: none;
        color: white;
        text-shadow: 1px 1px 1px rgba(0,0,0,0.8);
        text-align: center;
        cursor: pointer;
        padding: 4px 2px;
        user-select: none;
      }

      .desktop-icon:hover,
      .desktop-icon:focus {
        outline: 1px dotted rgba(255,255,255,0.9);
        outline-offset: 0;
      }

      .desktop-icon .icon {
        width: 42px;
        height: 42px;
        margin: 0 auto 6px;
        display: grid;
        place-items: center;
        font-size: 30px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.18);
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2);
      }

      .desktop-icon .label {
        display: block;
        line-height: 1.15;
        font-size: 12px;
        word-break: break-word;
      }

      .desktop-icon.custom .icon {
        background: rgba(255,255,255,0.07);
      }

      .shortcut-icon {
        position: relative;
        width: 32px;
        height: 32px;
        margin: 0 auto 4px;
        display: block;
      }

      .shortcut-monitor {
        background: linear-gradient(180deg, #dfe9f2, #a0b2c9);
        border: 2px solid #3d3d3d;
        border-top-color: #fff;
        border-left-color: #fff;
        position: relative;
      }

      .shortcut-monitor::before {
        content: "";
        position: absolute;
        inset: 6px 8px 12px;
        background: linear-gradient(180deg, #4a6bd8, #1d2b7d);
        border: 1px solid #2a2a2a;
      }

      .shortcut-monitor::after {
        content: "";
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: -5px;
        height: 8px;
        background: linear-gradient(180deg, #c0c0c0, #808080);
        border-top: 2px solid #fff;
      }

      .shortcut-folder {
        background: linear-gradient(180deg, #f0d472, #dca92d);
        border: 2px solid #6c4f13;
        border-top-color: #ffe9a7;
        border-left-color: #ffe9a7;
        position: relative;
      }

      .shortcut-folder::before {
        content: "";
        position: absolute;
        left: 3px;
        right: 3px;
        top: -6px;
        height: 8px;
        border-radius: 2px 4px 0 0;
        background: #efc952;
        border: 2px solid #6c4f13;
        border-bottom: none;
      }

      .shortcut-bin {
        background: linear-gradient(180deg, #d4d4d4, #7d7d7d);
        border: 2px solid #404040;
        border-top-color: #fff;
        border-left-color: #fff;
        position: relative;
      }

      .shortcut-bin::before {
        content: "";
        position: absolute;
        left: 7px;
        right: 7px;
        top: 8px;
        bottom: 8px;
        border: 2px solid #555;
        background: linear-gradient(180deg, #dfe3df, #b8b3b8);
      }

      .shortcut-bin::after {
        content: "";
        position: absolute;
        left: 9px;
        right: 9px;
        top: 4px;
        height: 6px;
        background: #a9a9a9;
        border: 2px solid #555;
        border-bottom: none;
      }

      .shortcut-app {
        background: linear-gradient(180deg, #d4ecff, #87bbef);
        border: 2px solid #2d5a93;
        border-top-color: #eff7ff;
        border-left-color: #eff7ff;
        position: relative;
      }

      .shortcut-app::before {
        content: "";
        position: absolute;
        inset: 5px;
        background: linear-gradient(135deg, #ffffff, #b2d4ff);
        border: 1px solid #30588d;
      }

      .window-layer {
        position: absolute;
        inset: 0;
        z-index: 10;
      }

      .window {
        position: absolute;
        display: flex;
        flex-direction: column;
        background: var(--win98-panel);
        border: 2px solid;
        border-color: var(--win98-light) var(--win98-shadow) var(--win98-shadow) var(--win98-light);
        box-shadow: 3px 3px 0 rgba(0,0,0,0.35);
        min-width: 260px;
        min-height: 160px;
      }

      .window.active {
        box-shadow: 5px 5px 0 rgba(0,0,0,0.45);
      }

      .window-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(90deg, #000080, #1084d0);
        color: white;
        height: 22px;
        padding: 2px 4px 2px 6px;
        cursor: move;
        user-select: none;
      }

      .window-title {
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .window-controls {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .window-button {
        width: 18px;
        height: 18px;
        display: grid;
        place-items: center;
        background: var(--win98-bg);
        border: 2px solid;
        border-color: var(--win98-light) var(--win98-shadow) var(--win98-shadow) var(--win98-light);
        padding: 0;
        color: #000;
        font-weight: 700;
        cursor: pointer;
      }

      .window-button:active {
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
      }

      .window-body {
        flex: 1;
        min-height: 0;
        padding: 4px;
        background: var(--win98-panel);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 2px solid;
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
        background: white;
      }

      .file-list {
        width: 100%;
        height: 100%;
        background: #fff;
        border: 2px solid;
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
        overflow: auto;
        padding: 8px;
      }

      .file-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        margin-bottom: 6px;
        border: 1px solid transparent;
        background: #f1f1f1;
        cursor: pointer;
        font-size: 14px;
      }

      .file-item:hover {
        border-color: #7d7d7d;
        background: #e6f0ff;
      }

      .file-item .glyph {
        width: 22px;
        text-align: center;
        font-size: 20px;
      }

      .bin-empty {
        display: grid;
        place-items: center;
        height: 100%;
        font-size: 16px;
        color: #333;
        background: #f5f5f5;
        border: 2px solid #a0a0a0;
      }

      .computer-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        height: 100%;
        padding: 8px;
        background: #fff;
        border: 2px solid;
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
      }

      .computer-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        background: #f5f5f5;
        border: 1px solid #b8b8b8;
        font-size: 14px;
      }

      .resize-handle {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 16px;
        height: 16px;
        cursor: nwse-resize;
        background: linear-gradient(135deg, #d5d5d5 0%, #d5d5d5 50%, #808080 50%, #808080 100%);
        border-top: 2px solid #fff;
        border-left: 2px solid #fff;
      }

      #taskbar {
        position: relative;
        height: var(--taskbar-h);
        background: var(--win98-bg);
        border-top: 2px solid var(--win98-light);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 6px;
        z-index: 100;
      }

      #start-button {
        height: 30px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px 0 8px;
        background: var(--win98-bg);
        border: 2px solid;
        border-color: var(--win98-light) var(--win98-shadow) var(--win98-shadow) var(--win98-light);
        font-weight: 700;
        cursor: pointer;
      }

      #start-button:active {
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
      }

      #start-button .logo {
        width: 16px;
        height: 16px;
        display: inline-block;
        position: relative;
        background: linear-gradient(135deg, #ff3a3a, #aa0000);
        border: 1px solid #000;
      }

      #start-button .logo::before {
        content: "";
        position: absolute;
        inset: 3px;
        background: linear-gradient(135deg, #fff, #dfe6ef);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 28% 100%, 0 70%);
      }

      #start-menu {
        position: absolute;
        left: 8px;
        bottom: 42px;
        width: 220px;
        background: var(--win98-bg);
        border: 2px solid;
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
        display: none;
        box-shadow: 4px 4px 0 rgba(0,0,0,0.35);
      }

      #start-menu.open {
        display: block;
      }

      #start-menu-inner {
        display: flex;
        min-height: 220px;
      }

      .brand {
        width: 28px;
        background: linear-gradient(180deg, #767676, #c5c5c5);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        font-weight: 700;
        letter-spacing: 1px;
        text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
        border-right: 2px solid #666;
      }

      #start-menu-list {
        flex: 1;
        list-style: none;
        margin: 0;
        padding: 4px;
        background: var(--win98-panel);
      }

      #start-menu-list li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        font-size: 12px;
        cursor: pointer;
      }

      #start-menu-list li:hover {
        background: var(--win98-blue);
        color: white;
      }

      #taskbar-window-list {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        overflow: hidden;
      }

      .taskbar-item {
        max-width: 170px;
        min-width: 90px;
        height: 30px;
        display: flex;
        align-items: center;
        padding: 4px 8px;
        font-size: 12px;
        border: 2px solid;
        border-color: var(--win98-light) var(--win98-shadow) var(--win98-shadow) var(--win98-light);
        background: var(--win98-bg);
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .taskbar-item.active {
        background: #d7d3c9;
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
      }

      #clock {
        width: 92px;
        min-width: 92px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        border: 2px solid;
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
        background: var(--win98-panel);
      }

      .context-menu {
        position: absolute;
        z-index: 200;
        min-width: 160px;
        background: var(--win98-bg);
        border: 2px solid;
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
        box-shadow: 3px 3px 0 rgba(0,0,0,0.3);
        display: none;
      }

      .context-menu.open { display: block; }

      .context-menu-item {
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }

      .context-menu-item:hover {
        background: var(--win98-blue);
        color: white;
      }

      #boot-screen,
      #login-screen {
        position: fixed;
        inset: 0;
        z-index: 999;
      }

      #boot-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #fff;
      }

      .boot-panel {
        text-align: center;
        font-size: 18px;
        letter-spacing: 0.08em;
      }

      .boot-logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 22px;
        border: 3px solid #fff;
        background: linear-gradient(135deg, #fff 0%, #a8b8ff 100%);
        position: relative;
      }

      .boot-logo::before {
        content: "";
        position: absolute;
        inset: 18px;
        background: linear-gradient(135deg, #ff0000, #b70000);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 22% 100%, 0 72%);
      }

      .boot-bar {
        width: 280px;
        height: 18px;
        border: 2px solid #fff;
        margin: 18px auto 0;
        background: #111;
        overflow: hidden;
      }

      .boot-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #6bd0ff, #d7f2ff);
        transition: width 0.18s ease;
      }

      #login-screen {
        display: none;
        background: rgba(0,0,0,0.8);
        align-items: center;
        justify-content: center;
      }

      .login-box {
        width: min(90vw, 420px);
        background: var(--win98-panel);
        border: 2px solid;
        border-color: var(--win98-light) var(--win98-shadow) var(--win98-shadow) var(--win98-light);
        box-shadow: 4px 4px 0 rgba(0,0,0,0.45);
      }

      .login-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(90deg, #000080, #1084d0);
        color: white;
        padding: 5px 8px;
        font-size: 12px;
        font-weight: 700;
      }

      .login-body {
        padding: 18px 16px 12px;
      }

      .login-grid {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 12px 8px;
        align-items: center;
        margin-bottom: 12px;
      }

      .login-grid label {
        font-size: 12px;
        font-weight: 700;
      }

      .login-grid input {
        width: 100%;
        padding: 6px 8px;
        border: 2px solid;
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
        background: white;
      }

      .login-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 8px;
      }

      .login-actions button {
        min-width: 80px;
        padding: 6px 12px;
        background: var(--win98-bg);
        border: 2px solid;
        border-color: var(--win98-light) var(--win98-shadow) var(--win98-shadow) var(--win98-light);
        cursor: pointer;
        font-weight: 700;
      }

      .login-actions button:active {
        border-color: var(--win98-shadow) var(--win98-light) var(--win98-light) var(--win98-shadow);
      }

      #desktop.hidden {
        display: none;
      }

      #taskbar.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="boot-screen">
      <div class="boot-panel">
        <div class="boot-logo" aria-hidden="true"></div>
        <div>Giggle OS</div>
        <div class="boot-bar"><div id="boot-fill" class="boot-bar-fill"></div></div>
      </div>
    </div>

    <div id="login-screen">
      <div class="login-box">
        <div class="login-header">Log On To Giggle OS</div>
        <div class="login-body">
          <div class="login-grid">
            <label for="username">User:</label>
            <input id="username" type="text" value="guest" />
            <label for="password">Password:</label>
            <input id="password" type="password" value="welcome" />
          </div>
          <div class="login-actions">
            <button type="button" id="cancel-login">Cancel</button>
            <button type="button" id="login-submit">Log On</button>
          </div>
        </div>
      </div>
    </div>

    <div id="desktop">
      <div id="desktop-icons" class="desktop-icons"></div>
      <div id="window-layer" class="window-layer"></div>
      <div id="context-menu" class="context-menu" aria-label="Desktop context menu"></div>
    </div>

    <div id="taskbar">
      <button id="start-button" type="button" aria-expanded="false">
        <span class="logo" aria-hidden="true"></span>
        <span>Start</span>
      </button>

      <div id="start-menu" aria-label="Start menu">
        <div id="start-menu-inner">
          <div class="brand">Giggle OS</div>
          <ul id="start-menu-list"></ul>
        </div>
      </div>

      <div id="taskbar-window-list"></div>
      <div id="clock">--:--</div>
    </div>

    <script>
      const appEntries = [
        { name: 'EReader', file: 'Apps/EReader.html', icon: '📖', kind: 'app' },
        { name: 'LocalMind', file: 'Apps/LocalMind.html', icon: '🧠', kind: 'app' },
        { name: 'MusiMobile', file: 'Apps/MusiMobile.html', icon: '🎵', kind: 'app' },
        { name: 'NotePlate', file: 'Apps/NotePlate.html', icon: '📝', kind: 'app' },
        { name: 'Youtube', file: 'Apps/Youtube.html', icon: '🎬', kind: 'app' },
        { name: 'asciispace', file: 'Apps/asciispace.html', icon: '🚀', kind: 'app' },
        { name: 'captaincallisto', file: 'Apps/captaincallisto.html', icon: '🪐', kind: 'app' },
        { name: 'chromedino', file: 'Apps/chromedino.html', icon: '🦖', kind: 'app' },
        { name: 'haven', file: 'Apps/haven.html', icon: '🏕️', kind: 'app' },
        { name: 'offlineparadise', file: 'Apps/offlineparadise.html', icon: '🌴', kind: 'app' },
        { name: 'packabunchas', file: 'Apps/packabunchas.html', icon: '📦', kind: 'app' },
        { name: 'rokepogue', file: 'Apps/rokepogue.html', icon: '📚', kind: 'app' },
        { name: 'spacehuggers', file: 'Apps/spacehuggers.html', icon: '🌌', kind: 'app' }
      ];

      const desktopShortcuts = [
        { name: 'My Computer', icon: '💻', kind: 'computer', target: 'Apps' },
        { name: 'Apps Folder', icon: '📁', kind: 'folder', target: 'Apps' },
        { name: 'Recycle Bin', icon: '🗑️', kind: 'bin', target: null }
      ];

      const allShortcuts = [...desktopShortcuts, ...appEntries.map((app) => ({ ...app, kind: 'app' }))];

      const bootScreen = document.getElementById('boot-screen');
      const loginScreen = document.getElementById('login-screen');
      const desktop = document.getElementById('desktop');
      const taskbar = document.getElementById('taskbar');
      const bootFill = document.getElementById('boot-fill');
      const desktopIcons = document.getElementById('desktop-icons');
      const startMenuList = document.getElementById('start-menu-list');
      const taskbarWindowList = document.getElementById('taskbar-window-list');
      const windowLayer = document.getElementById('window-layer');
      const startButton = document.getElementById('start-button');
      const startMenu = document.getElementById('start-menu');
      const clockEl = document.getElementById('clock');
      const contextMenu = document.getElementById('context-menu');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');

      const windowMap = new Map();
      let loginReady = false;
      let audioCtx = null;

      function makeWindowId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return `window-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function ensureAudio() {
        if (!audioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) audioCtx = new AudioCtx();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      }

      function playBootTone(freq, duration, type='square', volume=0.05, delay=0) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = volume;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + duration);
      }

      function bootSequence() {
        let progress = 0;
        const interval = setInterval(() => {
          progress += 10;
          bootFill.style.width = `${progress}%`;
          if (progress >= 100) {
            clearInterval(interval);
            setTimeout(() => {
              bootScreen.style.display = 'none';
              loginScreen.style.display = 'flex';
              ensureAudio();
              playBootTone(640, 0.18, 'square', 0.04, 0.02);
              playBootTone(780, 0.22, 'triangle', 0.04, 0.22);
            }, 250);
          }
        }, 120);
      }

      function finishLogin() {
        const user = usernameInput.value.trim() || 'guest';
        if (user) {
          loginReady = true;
          loginScreen.style.display = 'none';
          desktop.style.display = 'block';
          taskbar.style.display = 'flex';
          ensureAudio();
          playBootTone(400, 0.14, 'triangle', 0.05, 0.02);
          playBootTone(620, 0.18, 'triangle', 0.05, 0.18);
          playBootTone(840, 0.2, 'square', 0.05, 0.34);
        }
      }

      function buildDesktopIcons() {
        allShortcuts.forEach((item) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'desktop-icon custom';
          button.setAttribute('aria-label', item.name);

          let iconMarkup = '<span class="shortcut-icon shortcut-app"></span>';
          if (item.kind === 'computer') iconMarkup = '<span class="shortcut-icon shortcut-monitor"></span>';
          if (item.kind === 'folder') iconMarkup = '<span class="shortcut-icon shortcut-folder"></span>';
          if (item.kind === 'bin') iconMarkup = '<span class="shortcut-icon shortcut-bin"></span>';

          button.innerHTML = `${iconMarkup}<span class="label">${item.name}</span>`;
          button.addEventListener('dblclick', () => openItem(item));
          desktopIcons.appendChild(button);
        });
      }

      function buildStartMenu() {
        appEntries.forEach((app) => {
          const li = document.createElement('li');
          li.innerHTML = `<span aria-hidden="true">${app.icon}</span><span>${app.name}</span>`;
          li.addEventListener('click', () => {
            openItem(app);
            toggleStartMenu(false);
          });
          startMenuList.appendChild(li);
        });
      }

      function createTaskbarItem(label) {
        const taskItem = document.createElement('div');
        taskItem.className = 'taskbar-item active';
        taskItem.textContent = label;
        taskItem.title = label;
        taskItem.addEventListener('click', () => {
          const win = [...document.querySelectorAll('.window')].find((w) => w.dataset.app === label);
          if (win) {
            if (win.style.display === 'none') {
              win.style.display = 'flex';
            }
            focusWindow(win);
          }
        });
        taskbarWindowList.appendChild(taskItem);
        return taskItem;
      }

      function openComputerWindow() {
        const title = 'My Computer';
        const existing = document.querySelector(`.window[data-app="${title}"]`);
        if (existing) {
          if (existing.style.display === 'none') existing.style.display = 'block';
          focusWindow(existing);
          return;
        }

        const win = document.createElement('div');
        win.className = 'window active';
        win.dataset.app = title;
        win.dataset.windowId = makeWindowId();
        win.style.left = '170px';
        win.style.top = '80px';
        win.style.width = '440px';
        win.style.height = '320px';

        const header = document.createElement('div');
        header.className = 'window-header';
        header.innerHTML = `
          <div class="window-title">${title}</div>
          <div class="window-controls">
            <button class="window-button" type="button" data-action="minimize">_</button>
            <button class="window-button" type="button" data-action="maximize">□</button>
            <button class="window-button" type="button" data-action="close">×</button>
          </div>
        `;

        const body = document.createElement('div');
        body.className = 'window-body';

        const computerList = document.createElement('div');
        computerList.className = 'computer-list';
        const drives = [
          { name: 'Local Disk (C:)', icon: '💾' },
          { name: 'Giggle Apps', icon: '📁' },
          { name: 'Network', icon: '🌐' }
        ];
        drives.forEach((item) => {
          const el = document.createElement('div');
          el.className = 'computer-item';
          el.innerHTML = `<span>${item.icon}</span><span>${item.name}</span>`;
          computerList.appendChild(el);
        });
        body.appendChild(computerList);

        win.appendChild(header);
        win.appendChild(body);

        const resize = document.createElement('div');
        resize.className = 'resize-handle';
        win.appendChild(resize);
        windowLayer.appendChild(win);

        const taskItem = createTaskbarItem(title);
        taskItem.dataset.windowId = win.dataset.windowId;
        win.dataset.taskbarItem = taskItem.dataset.windowId;
        windowMap.set(win.dataset.windowId, { win, taskItem });

        attachWindowInteractions(win, title, taskItem);
        focusWindow(win);
      }

      function openExplorerWindow() {
        const title = 'Apps Folder';
        const existing = document.querySelector(`.window[data-app="${title}"]`);
        if (existing) {
          if (existing.style.display === 'none') existing.style.display = 'block';
          focusWindow(existing);
          return;
        }

        const win = document.createElement('div');
        win.className = 'window active';
        win.dataset.app = title;
        win.dataset.windowId = makeWindowId();
        win.style.left = '130px';
        win.style.top = '70px';
        win.style.width = '520px';
        win.style.height = '430px';

        const header = document.createElement('div');
        header.className = 'window-header';
        header.innerHTML = `
          <div class="window-title">${title}</div>
          <div class="window-controls">
            <button class="window-button" type="button" data-action="minimize">_</button>
            <button class="window-button" type="button" data-action="maximize">□</button>
            <button class="window-button" type="button" data-action="close">×</button>
          </div>
        `;

        const body = document.createElement('div');
        body.className = 'window-body';

        const list = document.createElement('div');
        list.className = 'file-list';
        appEntries.forEach((app) => {
          const item = document.createElement('div');
          item.className = 'file-item';
          item.innerHTML = `<div class="glyph">${app.icon}</div><div>${app.name}.html</div>`;
          item.addEventListener('click', () => openItem(app));
          list.appendChild(item);
        });

        body.appendChild(list);
        win.appendChild(header);
        win.appendChild(body);

        const resize = document.createElement('div');
        resize.className = 'resize-handle';
        win.appendChild(resize);
        windowLayer.appendChild(win);

        const taskItem = createTaskbarItem(title);
        taskItem.dataset.windowId = win.dataset.windowId;
        win.dataset.taskbarItem = taskItem.dataset.windowId;
        windowMap.set(win.dataset.windowId, { win, taskItem });

        attachWindowInteractions(win, title, taskItem);
        focusWindow(win);
      }

      function openRecycleBinWindow() {
        const title = 'Recycle Bin';
        const existing = document.querySelector(`.window[data-app="${title}"]`);
        if (existing) {
          if (existing.style.display === 'none') existing.style.display = 'block';
          focusWindow(existing);
          return;
        }

        const win = document.createElement('div');
        win.className = 'window active';
        win.dataset.app = title;
        win.dataset.windowId = makeWindowId();
        win.style.left = '200px';
        win.style.top = '100px';
        win.style.width = '300px';
        win.style.height = '220px';

        const header = document.createElement('div');
        header.className = 'window-header';
        header.innerHTML = `
          <div class="window-title">${title}</div>
          <div class="window-controls">
            <button class="window-button" type="button" data-action="minimize">_</button>
            <button class="window-button" type="button" data-action="maximize">□</button>
            <button class="window-button" type="button" data-action="close">×</button>
          </div>
        `;

        const body = document.createElement('div');
        body.className = 'window-body';
        body.innerHTML = '<div class="bin-empty">Recycle Bin is empty.</div>';

        win.appendChild(header);
        win.appendChild(body);
        const resize = document.createElement('div');
        resize.className = 'resize-handle';
        win.appendChild(resize);
        windowLayer.appendChild(win);

        const taskItem = createTaskbarItem(title);
        taskItem.dataset.windowId = win.dataset.windowId;
        win.dataset.taskbarItem = taskItem.dataset.windowId;
        windowMap.set(win.dataset.windowId, { win, taskItem });

        attachWindowInteractions(win, title, taskItem);
        focusWindow(win);
      }

      function openItem(item) {
        if (item.kind === 'computer') {
          openComputerWindow();
          return;
        }

        if (item.kind === 'folder') {
          openExplorerWindow();
          return;
        }

        if (item.kind === 'bin') {
          openRecycleBinWindow();
          return;
        }

        const existing = document.querySelector(`.window[data-app="${item.name}"]`);
        if (existing) {
          if (existing.style.display === 'none') existing.style.display = 'block';
          focusWindow(existing);
          return;
        }

        const win = document.createElement('div');
        win.className = 'window active';
        win.dataset.app = item.name;
        win.dataset.windowId = makeWindowId();

        const width = Math.min(window.innerWidth * 0.72, 860);
        const height = Math.min(window.innerHeight * 0.68, 620);
        const left = 100 + (windowMap.size * 22) % Math.max(30, window.innerWidth - width - 140);
        const top = 70 + (windowMap.size * 18) % Math.max(30, window.innerHeight - height - 140);

        win.style.left = `${left}px`;
        win.style.top = `${top}px`;
        win.style.width = `${width}px`;
        win.style.height = `${height}px`;

        const header = document.createElement('div');
        header.className = 'window-header';
        header.innerHTML = `
          <div class="window-title">${item.name}</div>
          <div class="window-controls">
            <button class="window-button" type="button" data-action="minimize">_</button>
            <button class="window-button" type="button" data-action="maximize">□</button>
            <button class="window-button" type="button" data-action="close">×</button>
          </div>
        `;

        const body = document.createElement('div');
        body.className = 'window-body';

        const iframe = document.createElement('iframe');
        iframe.src = item.file;
        iframe.title = item.name;
        iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals');
        body.appendChild(iframe);

        win.appendChild(header);
        win.appendChild(body);

        const resize = document.createElement('div');
        resize.className = 'resize-handle';
        win.appendChild(resize);
        windowLayer.appendChild(win);

        const taskItem = createTaskbarItem(item.name);
        taskItem.dataset.windowId = win.dataset.windowId;
        win.dataset.taskbarItem = taskItem.dataset.windowId;
        windowMap.set(win.dataset.windowId, { win, taskItem });

        attachWindowInteractions(win, item.name, taskItem);
        focusWindow(win);
      }

      function attachWindowInteractions(win, title, taskItem) {
        let dragging = false;
        let resizing = false;
        let startX = 0;
        let startY = 0;
        let origin = null;

        const header = win.querySelector('.window-header');
        const resizeHandle = win.querySelector('.resize-handle');
        const closeBtn = win.querySelector('[data-action="close"]');
        const minimizeBtn = win.querySelector('[data-action="minimize"]');
        const maximizeBtn = win.querySelector('[data-action="maximize"]');

        header.addEventListener('mousedown', (event) => {
          if (event.target.closest('.window-button')) return;
          dragging = true;
          focusWindow(win);
          const rect = win.getBoundingClientRect();
          startX = event.clientX;
          startY = event.clientY;
          origin = { left: rect.left, top: rect.top };
        });

        resizeHandle.addEventListener('mousedown', (event) => {
          event.preventDefault();
          resizing = true;
          focusWindow(win);
          startX = event.clientX;
          startY = event.clientY;
          origin = { width: win.offsetWidth, height: win.offsetHeight };
        });

        document.addEventListener('mousemove', (event) => {
          if (dragging && origin) {
            const dx = event.clientX - startX;
            const dy = event.clientY - startY;
            const nextLeft = Math.min(Math.max(origin.left + dx, 0), window.innerWidth - 120);
            const nextTop = Math.min(Math.max(origin.top + dy, 0), window.innerHeight - 100);
            win.style.left = `${nextLeft}px`;
            win.style.top = `${nextTop}px`;
          }

          if (resizing && origin) {
            const dx = event.clientX - startX;
            const dy = event.clientY - startY;
            const nextWidth = Math.min(Math.max(origin.width + dx, 260), window.innerWidth - 18);
            const nextHeight = Math.min(Math.max(origin.height + dy, 180), window.innerHeight - 65);
            win.style.width = `${nextWidth}px`;
            win.style.height = `${nextHeight}px`;
          }
        });

        document.addEventListener('mouseup', () => {
          dragging = false;
          resizing = false;
          origin = null;
        });

        closeBtn.addEventListener('click', () => closeWindow(win));

        minimizeBtn.addEventListener('click', () => {
          win.style.display = 'none';
          taskItem.style.opacity = '0.6';
          taskItem.classList.remove('active');
        });

        maximizeBtn.addEventListener('click', () => {
          if (win.dataset.maximized === 'true') {
            win.dataset.maximized = 'false';
            win.style.left = win.dataset.prevLeft || '100px';
            win.style.top = win.dataset.prevTop || '60px';
            win.style.width = win.dataset.prevWidth || '700px';
            win.style.height = win.dataset.prevHeight || '500px';
          } else {
            win.dataset.prevLeft = win.style.left;
            win.dataset.prevTop = win.style.top;
            win.dataset.prevWidth = win.style.width;
            win.dataset.prevHeight = win.style.height;
            win.dataset.maximized = 'true';
            win.style.left = '0px';
            win.style.top = '0px';
            win.style.width = `${window.innerWidth - 4}px`;
            win.style.height = `${window.innerHeight - 42}px`;
          }
          focusWindow(win);
        });

        win.addEventListener('mousedown', () => focusWindow(win));
      }

      function focusWindow(win) {
        if (!win) return;
        if (win.style.display === 'none') {
          win.style.display = 'flex';
        }
        const allWindows = document.querySelectorAll('.window');
        allWindows.forEach((w) => w.classList.remove('active'));
        win.classList.add('active');

        const taskItems = document.querySelectorAll('.taskbar-item');
        taskItems.forEach((item) => {
          item.classList.remove('active');
          item.style.opacity = '1';
        });

        const associated = [...taskItems].find((item) => item.textContent === win.dataset.app);
        if (associated) associated.classList.add('active');
      }

      function closeWindow(win) {
        const taskItem = [...taskbarWindowList.children].find((item) => item.textContent === win.dataset.app);
        if (taskItem) taskItem.remove();
        win.remove();
        windowMap.delete(win.dataset.windowId);
      }

      function toggleStartMenu(force) {
        const shouldOpen = typeof force === 'boolean' ? force : !startMenu.classList.contains('open');
        startMenu.classList.toggle('open', shouldOpen);
        startButton.setAttribute('aria-expanded', String(shouldOpen));
      }

      function buildContextMenu(x, y) {
        contextMenu.innerHTML = `
          <div class="context-menu-item" data-action="explorer">Open Apps Folder</div>
          <div class="context-menu-item" data-action="computer">My Computer</div>
          <div class="context-menu-item" data-action="refresh">Refresh</div>
        `;
        contextMenu.style.left = `${x}px`;
        contextMenu.style.top = `${y}px`;
        contextMenu.classList.add('open');

        contextMenu.querySelector('[data-action="explorer"]').addEventListener('click', () => {
          openExplorerWindow();
          contextMenu.classList.remove('open');
        });

        contextMenu.querySelector('[data-action="computer"]').addEventListener('click', () => {
          openComputerWindow();
          contextMenu.classList.remove('open');
        });

        contextMenu.querySelector('[data-action="refresh"]').addEventListener('click', () => {
          location.reload();
        });
      }

      function updateClock() {
        const now = new Date();
        clockEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      }

      startButton.addEventListener('click', () => toggleStartMenu());

      document.addEventListener('click', (event) => {
        if (!startMenu.contains(event.target) && !startButton.contains(event.target)) {
          toggleStartMenu(false);
        }
        if (!contextMenu.contains(event.target) && !event.target.closest('#desktop')) {
          contextMenu.classList.remove('open');
        }
      });

      desktop.addEventListener('contextmenu', (event) => {
        if (event.target.closest('.window')) return;
        event.preventDefault();
        buildContextMenu(event.clientX, event.clientY);
      });

      document.getElementById('login-submit').addEventListener('click', () => {
        ensureAudio();
        finishLogin();
      });

      document.getElementById('cancel-login').addEventListener('click', () => {
        usernameInput.value = 'guest';
        passwordInput.value = 'welcome';
      });

      passwordInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          ensureAudio();
          finishLogin();
        }
      });

      bootSequence();
      buildDesktopIcons();
      buildStartMenu();
      updateClock();
      setInterval(updateClock, 30000);
    </script>
  </body>
</html>
