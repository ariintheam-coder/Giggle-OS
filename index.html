<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giggle Notes</title>
  <style>
    :root {
      --bg: #111116;
      --surface: #19191f;
      --surface-2: #202027;
      --surface-soft: #24232c;
      --panel: #16161b;
      --text: #e9e7ef;
      --muted: #9a98a3;
      --border: #2d2b34;
      --accent: #e6aa62;
      --accent-contrast: #1a130e;
      --danger: #c95e69;
      --shadow: rgba(0,0,0,0.35);
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }

    .app {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 14px 14px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }
    .brand-mark {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: var(--accent-contrast);
      font-weight: 800;
    }

    .icon-btn {
      border: 0;
      background: transparent;
      border-radius: 8px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: var(--muted);
    }
    .icon-btn:hover { background: var(--surface-soft); color: var(--text); }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin: 14px 10px 10px;
      padding: 8px 10px;
      color: var(--muted);
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: 0;
      outline: none;
      color: var(--text);
    }
    .search-box .shortcut {
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 10px;
      padding: 2px 5px;
      color: var(--muted);
    }

    .nav-list {
      display: grid;
      gap: 4px;
      padding: 4px 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    .nav-item {
      border: 0;
      background: transparent;
      color: var(--muted);
      text-align: left;
      padding: 9px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .nav-item.active, .nav-item:hover { background: var(--surface-soft); color: var(--text); }
    .nav-item .count { margin-left: auto; font-size: 10px; color: var(--muted); }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 12px 8px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 10px;
      font-weight: 700;
    }
    .section-head button {
      background: transparent;
      color: var(--muted);
      border: 0;
      font-size: 18px;
    }

    .note-list {
      display: grid;
      gap: 4px;
      padding: 0 8px 8px;
      overflow: auto;
      max-height: 220px;
    }
    .note-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 9px 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      text-align: left;
    }
    .note-item:hover, .note-item.selected { background: var(--surface-soft); color: var(--text); }
    .note-item .meta { min-width: 0; flex: 1; }
    .note-item strong, .note-item small {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .note-item strong { font-size: 11px; font-weight: 600; }
    .note-item small { margin-top: 3px; color: var(--muted); font-size: 9px; }

    .folder-list {
      padding: 0 8px 12px;
      overflow: auto;
      flex: 1;
    }
    .folder-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      border-radius: 8px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }
    .folder-row:hover, .folder-row.selected { background: var(--surface-soft); color: var(--text); }
    .folder-row .count { margin-left: auto; font-size: 10px; color: var(--muted); }
    .folder-notes { margin-left: 18px; padding-left: 8px; border-left: 1px solid var(--border); }
    .folder-note {
      display: block;
      width: 100%;
      padding: 6px 8px;
      margin-top: 3px;
      border-radius: 7px;
      background: transparent;
      border: 0;
      text-align: left;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .folder-note:hover { background: var(--surface-soft); color: var(--text); }

    .sidebar-footer {
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px 8px;
      color: var(--muted);
      font-size: 11px;
    }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(230,170,98,0.2);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      padding: 0 22px;
      border-bottom: 1px solid var(--border);
    }
    .crumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11px;
    }
    .top-actions { display: flex; align-items: center; gap: 6px; }
    .small-action {
      background: transparent;
      border: 0;
      color: var(--muted);
      border-radius: 8px;
      min-width: 32px;
      height: 32px;
      padding: 0 10px;
    }
    .small-action:hover { background: var(--surface-soft); color: var(--text); }
    .save-state { font-size: 10px; color: var(--muted); margin-right: 8px; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      min-height: 0;
      flex: 1;
    }

    .editor-area {
      min-width: 0;
      overflow: auto;
      position: relative;
    }
    .editor-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 42px 54px 80px;
    }
    .note-eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 12px;
    }
    .favorite-toggle {
      margin-left: auto;
      background: transparent;
      border: 0;
      color: var(--accent);
      font-size: 18px;
      border-radius: 7px;
      padding: 4px 6px;
    }
    .favorite-toggle:hover { background: var(--surface-soft); }
    .note-title {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      resize: none;
      font-size: 36px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.045em;
      outline: none;
      min-height: 60px;
    }
    .note-title::placeholder { color: rgba(154,152,163,0.8); }
    .note-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 0 18px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 10px;
    }
    .tag-chip {
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(230,170,98,0.12);
      color: var(--accent);
    }
    .editor, .preview {
      min-height: 54vh;
      width: 100%;
      margin-top: 18px;
      font-size: 15px;
      line-height: 1.9;
      white-space: pre-wrap;
    }
    .editor {
      background: transparent;
      border: 0;
      outline: none;
      resize: vertical;
      color: var(--text);
    }
    .preview {
      display: none;
      overflow-wrap: anywhere;
    }
    .preview h1, .preview h2, .preview h3 { letter-spacing: -0.03em; margin: 0.8em 0 0.4em; }
    .preview h1 { font-size: 30px; }
    .preview h2 { font-size: 24px; }
    .preview h3 { font-size: 18px; }
    .preview p { margin: 0.8em 0; }
    .preview a { color: var(--accent); text-decoration: none; }
    .preview ul, .preview ol { padding-left: 24px; }
    .preview blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      color: var(--muted);
      margin: 16px 0;
    }
    .preview code {
      padding: 2px 5px;
      border-radius: 5px;
      background: var(--surface-soft);
    }
    .preview pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      overflow: auto;
    }
    .preview table { border-collapse: collapse; width: 100%; }
    .preview th, .preview td { border: 1px solid var(--border); padding: 8px; }

    .right-panel {
      border-left: 1px solid var(--border);
      background: rgba(25,25,31,0.9);
      padding: 24px 16px;
      overflow: auto;
    }
    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .panel-section { margin-bottom: 26px; }
    .panel-empty { color: var(--muted); font-size: 11px; line-height: 1.6; }
    .link-card {
      display: block;
      width: 100%;
      margin: 6px 0;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      padding: 10px 12px;
      text-decoration: none;
      color: var(--text);
    }
    .link-card strong { display: block; font-size: 11px; font-weight: 600; }
    .link-card small { color: var(--muted); font-size: 10px; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-button {
      background: var(--surface-soft);
      border: 0;
      border-radius: 999px;
      padding: 5px 8px;
      color: var(--muted);
      font-size: 10px;
    }

    .statusbar {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 10px;
    }
    .status-right { display: flex; gap: 12px; }

    .hidden { display: none !important; }

    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .workspace { grid-template-columns: 1fr; }
      .right-panel { display: none; }
      .editor-wrap { padding: 24px 18px 60px; }
      .topbar { padding: 0 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand-bar">
        <div class="brand">
          <span class="brand-mark">N</span>
          <span>Giggle Notes</span>
        </div>
        <button class="icon-btn" id="newNoteBtn" title="New note">＋</button>
      </div>

      <label class="search-box" aria-label="Search notes">
        <span>⌕</span>
        <input id="searchInput" placeholder="Search notes..." autocomplete="off" />
        <span class="shortcut">⌘ K</span>
      </label>

      <nav class="nav-list">
        <button class="nav-item active" data-view="all"><span>☰</span> All notes <span class="count" id="allCount">0</span></button>
        <button class="nav-item" data-view="recent"><span>⏱</span> Recently edited</button>
        <button class="nav-item" data-view="starred"><span>★</span> Starred notes</button>
        <button class="nav-item" id="dailyNoteBtn"><span>✦</span> Daily note</button>
        <button class="nav-item" id="graphBtn"><span>◌</span> Graph view</button>
      </nav>

      <div class="section-head">
        <span>Notes</span>
      </div>
      <div class="note-list" id="noteList"></div>

      <div class="section-head">
        <span>Folders</span>
        <button id="addFolderBtn" title="New folder">＋</button>
      </div>
      <div class="folder-list" id="folderList"></div>

      <div class="sidebar-footer">
        <div class="profile">
          <div class="avatar">G</div>
          <div><div>Your workspace</div><small>Saved on this device</small></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="crumbs">
          <button class="icon-btn" id="mobileMenuBtn" title="Menu" style="display:none;">☰</button>
          <span id="crumbFolder">Workspace</span>
          <span>/</span>
          <strong id="crumbTitle">Welcome</strong>
        </div>
        <div class="top-actions">
          <span id="saveState" class="save-state">All changes saved</span>
          <button class="small-action" id="viewToggleBtn">Preview</button>
          <button class="small-action" id="copyLinkBtn">Copy link</button>
          <button class="small-action" id="moreBtn">⋯</button>
        </div>
      </header>

      <div class="workspace">
        <section class="editor-area">
          <div class="editor-wrap">
            <div id="emptyState" class="hidden">
              <h2>No note selected</h2>
              <p>Create your first note and let ideas find their way to each other.</p>
              <button class="small-action" id="emptyNewNoteBtn">Create a note</button>
            </div>

            <div id="editorContent">
              <div class="note-eyebrow">
                <span id="folderLabel">Workspace</span>
                <span>•</span>
                <span id="updatedLabel">Edited just now</span>
                <button class="favorite-toggle" id="favoriteToggle" title="Star note">☆</button>
              </div>

              <textarea id="noteTitle" class="note-title" rows="1" placeholder="Untitled"></textarea>

              <div class="note-meta">
                <span>Created <span id="createdLabel"></span></span>
                <span id="tagPills"></span>
              </div>

              <div id="editorWrap" class="editor"></div>
              <article id="preview" class="preview"></article>
            </div>
          </div>
        </section>

        <aside class="right-panel" id="rightPanel"></aside>
      </div>

      <footer class="statusbar">
        <span id="statusWords">0 words</span>
        <div class="status-right">
          <span id="statusLinks">0 links</span>
          <span>Markdown</span>
          <span>UTF-8</span>
        </div>
      </footer>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'giggle-notes-v1';
    const initialNotes = [
      {
        id: 'welcome',
        title: 'Welcome to Giggle Notes',
        folder: 'Getting Started',
        body: '# Welcome to Giggle Notes\n\nThis is your personal knowledge space. Use it to capture ideas, collect notes, and link your thoughts together.\n\n## Quick start\n- Create a note with the new note button\n- Add tags like #ideas or #project\n- Search your workspace instantly\n\n> Your notes stay right in this browser, and you can export them anytime.',
        created: Date.now() - 100000,
        updated: Date.now() - 50000,
        favorite: true,
      },
      {
        id: 'ideas',
        title: 'Ideas worth exploring',
        folder: 'Personal',
        body: '# Ideas worth exploring\n\nA little space for thoughts that might become something.\n\n- What would I love to learn this year?\n- A tiny tool that makes a daily task delightful\n- Places to visit when the days get longer',
        created: Date.now() - 80000,
        updated: Date.now() - 30000,
        favorite: false,
      }
    ];

    const state = loadState();
    let selectedId = state.notes[0]?.id ?? null;
    let activeView = 'all';
    let folderFilter = null;
    let previewMode = false;
    let saveTimer = null;
    let searchTerm = '';

    const els = {
      noteList: document.getElementById('noteList'),
      folderList: document.getElementById('folderList'),
      searchInput: document.getElementById('searchInput'),
      allCount: document.getElementById('allCount'),
      selectedTitle: document.getElementById('crumbTitle'),
      folderLabel: document.getElementById('folderLabel'),
      updatedLabel: document.getElementById('updatedLabel'),
      createdLabel: document.getElementById('createdLabel'),
      tagPills: document.getElementById('tagPills'),
      editorWrap: document.getElementById('editorWrap'),
      preview: document.getElementById('preview'),
      noteTitle: document.getElementById('noteTitle'),
      rightPanel: document.getElementById('rightPanel'),
      emptyState: document.getElementById('emptyState'),
      editorContent: document.getElementById('editorContent'),
      statusWords: document.getElementById('statusWords'),
      statusLinks: document.getElementById('statusLinks'),
      saveState: document.getElementById('saveState'),
      crumbFolder: document.getElementById('crumbFolder'),
    };

    function escapeHtml(value = '') {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && Array.isArray(saved.notes)) return saved;
      } catch (e) {}
      return { notes: initialNotes, folders: ['Getting Started', 'Personal'], theme: 'dark', fontSize: 15 };
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      els.saveState.textContent = 'All changes saved';
    }

    function scheduleSave() {
      clearTimeout(saveTimer);
      els.saveState.textContent = 'Saving…';
      saveTimer = setTimeout(() => {
        persist();
        renderFolders();
        renderRightPanel();
      }, 400);
    }

    function currentNote() {
      return state.notes.find(n => n.id === selectedId) || null;
    }

    function formatDate(ts) {
      const d = new Date(ts);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    function getTags(body = '') {
      return [...new Set((body.match(/#[\w-]+/g) || []).map(t => t.slice(1)))];
    }

    function filteredNotes() {
      let notes = [...state.notes];
      if (activeView === 'recent') notes.sort((a, b) => b.updated - a.updated);
      if (activeView === 'starred') notes = notes.filter(n => n.favorite);
      if (folderFilter) notes = notes.filter(n => n.folder === folderFilter);
      if (searchTerm) {
        const q = searchTerm.toLowerCase();
        notes = notes.filter(note => `${note.title} ${note.body} ${note.folder}`.toLowerCase().includes(q));
      }
      return notes;
    }

    function renderNotes() {
      const notes = filteredNotes();
      els.noteList.innerHTML = notes.length
        ? notes.map(note => `
          <button class="note-item ${note.id === selectedId ? 'selected' : ''}" data-note-id="${note.id}">
            <span>📝</span>
            <span class="meta">
              <strong>${escapeHtml(note.title || 'Untitled')}</strong>
              <small>${escapeHtml(note.folder || 'Unfiled')} • ${formatDate(note.updated)}</small>
            </span>
          </button>
        `).join('')
        : '<div class="note-item"><span>—</span><span class="meta"><strong>No notes here yet</strong></span></div>';

      document.querySelectorAll('.note-item').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedId = btn.dataset.noteId;
          renderAll();
        });
      });

      const allNotes = state.notes.length;
      els.allCount.textContent = String(allNotes);
    }

    function renderFolders() {
      const folders = [...new Set(state.notes.map(n => n.folder || 'Unfiled'))];
      els.folderList.innerHTML = folders.length
        ? folders.map(folder => {
            const items = state.notes.filter(n => (n.folder || 'Unfiled') === folder);
            return `
              <div>
                <div class="folder-row ${folderFilter === folder ? 'selected' : ''}" data-folder="${escapeHtml(folder)}">
                  <span>📁</span>
                  <span>${escapeHtml(folder)}</span>
                  <span class="count">${items.length}</span>
                </div>
                <div class="folder-notes">
                  ${items.map(note => `
                    <button class="folder-note" data-note-id="${note.id}">${escapeHtml(note.title || 'Untitled')}</button>
                  `).join('')}
                </div>
              </div>
            `;
          }).join('')
        : '<div class="panel-empty">No folders yet. Add one.</div>';

      els.folderList.querySelectorAll('.folder-row').forEach(row => {
        row.addEventListener('click', () => {
          folderFilter = folderFilter === row.dataset.folder ? null : row.dataset.folder;
          renderAll();
        });
      });

      els.folderList.querySelectorAll('.folder-note').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedId = btn.dataset.noteId;
          folderFilter = null;
          renderAll();
        });
      });
    }

    function renderRightPanel() {
      const note = currentNote();
      if (!note) {
        els.rightPanel.innerHTML = '<div class="panel-empty">Select a note to see connections, tags, and saved links.</div>';
        return;
      }

      const links = [...new Set((note.body.match(/\[[^\]]+\]\((.*?)\)/g) || []).map(m => m.replace(/^.*\(|\).*$/g, '')))]
      const tags = getTags(note.body);
      const linkedNotes = state.notes.filter(n => n.id !== note.id && n.body.includes(note.title || ''));

      els.rightPanel.innerHTML = `
        <div class="panel-section">
          <div class="panel-title"><span>Incoming links</span><span>${linkedNotes.length}</span></div>
          ${linkedNotes.length ? linkedNotes.map(n => `
            <button class="link-card" data-note-id="${n.id}">
              <strong>${escapeHtml(n.title || 'Untitled')}</strong>
              <small>${escapeHtml(n.folder || 'Unfiled')}</small>
            </button>
          `).join('') : '<div class="panel-empty">Links you add with [[double brackets]] appear here.</div>'}
        </div>

        <div class="panel-section">
          <div class="panel-title"><span>Backlinks</span><span>${links.length}</span></div>
          ${links.length ? links.map(link => `
            <div class="link-card"><strong>${escapeHtml(link)}</strong><small>External or internal reference</small></div>
          `).join('') : '<div class="panel-empty">No note links here yet.</div>'}
        </div>

        <div class="panel-section">
          <div class="panel-title"><span>Tags</span><span>${tags.length}</span></div>
          ${tags.length ? `
            <div class="tag-list">
              ${tags.map(tag => `<button class="tag-button" data-tag="${tag}">#${tag}</button>`).join('')}
            </div>
          ` : '<div class="panel-empty">Add #tags anywhere in your note to collect related ideas.</div>'}
        </div>
      `;

      els.rightPanel.querySelectorAll('[data-note-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedId = btn.dataset.noteId;
          renderAll();
        });
      });

      els.rightPanel.querySelectorAll('[data-tag]').forEach(btn => {
        btn.addEventListener('click', () => {
          searchTerm = '#' + btn.dataset.tag;
          renderAll();
        });
      });
    }

    function renderEditor() {
      const note = currentNote();
      if (!note) {
        els.emptyState.classList.remove('hidden');
        els.editorContent.classList.add('hidden');
        return;
      }

      els.emptyState.classList.add('hidden');
      els.editorContent.classList.remove('hidden');

      els.noteTitle.value = note.title || '';
      els.folderLabel.textContent = note.folder || 'Unfiled';
      els.crumbFolder.textContent = note.folder || 'Workspace';
      els.crumbTitle.textContent = note.title || 'Untitled';
      els.updatedLabel.textContent = `Updated ${formatTime(note.updated)}`;
      els.createdLabel.textContent = formatDate(note.created);
      els.saveState.textContent = 'All changes saved';
      els.noteTitle.dataset.noteId = note.id;
      document.getElementById('favoriteToggle').textContent = note.favorite ? '★' : '☆';

      const tags = getTags(note.body);
      els.tagPills.innerHTML = tags.length ? tags.map(tag => `<span class="tag-chip">#${escapeHtml(tag)}</span>`).join('') : '<span class="tag-chip">#untagged</span>';

      if (previewMode) {
        els.editorWrap.style.display = 'none';
        els.preview.style.display = 'block';
        const raw = note.body || '';
        const html = markdownToHtml(raw);
        els.preview.innerHTML = html;
      } else {
        els.editorWrap.style.display = 'block';
        els.preview.style.display = 'none';
        els.editorWrap.value = note.body || '';
      }

      updateStats(note.body || '');
    }

    function markdownToHtml(markdown) {
      const text = escapeHtml(markdown)
        .replace(/^### (.*)$/gm, '<h3>$1</h3>')
        .replace(/^## (.*)$/gm, '<h2>$1</h2>')
        .replace(/^# (.*)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2" />')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n/g, '<br>');
      return text;
    }

    function updateStats(body) {
      const words = body.trim() ? body.trim().split(/\s+/).length : 0;
      const links = body.match(/\[[^\]]+\]\([^)]*\)/g) || [];
      els.statusWords.textContent = `${words} ${words === 1 ? 'word' : 'words'}`;
      els.statusLinks.textContent = `${links.length} ${links.length === 1 ? 'link' : 'links'}`;
    }

    function renderAll() {
      renderNotes();
      renderFolders();
      renderRightPanel();
      renderEditor();
    }

    function newNote(title = 'Untitled', folder = folderFilter || 'Personal', body = '') {
      const note = {
        id: crypto.randomUUID ? crypto.randomUUID() : `note-${Date.now()}`,
        title,
        folder,
        body,
        created: Date.now(),
        updated: Date.now(),
        favorite: false,
      };
      state.notes.unshift(note);
      selectedId = note.id;
      renderAll();
      persist();
    }

    document.getElementById('newNoteBtn').addEventListener('click', () => newNote());
    document.getElementById('emptyNewNoteBtn').addEventListener('click', () => newNote());
    document.getElementById('dailyNoteBtn').addEventListener('click', () => {
      const date = new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      newNote(`Daily note · ${date}`, 'Personal', `# Daily note\n\nWhat happened today?\n\n- \n- \n`);
    });

    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        btn.classList.add('active');
        activeView = btn.dataset.view || 'all';
        renderNotes();
      });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchTerm = e.target.value.trim();
      renderNotes();
    });

    document.getElementById('viewToggleBtn').addEventListener('click', () => {
      previewMode = !previewMode;
      document.getElementById('viewToggleBtn').textContent = previewMode ? 'Edit' : 'Preview';
      renderEditor();
    });

    document.getElementById('noteTitle').addEventListener('input', (e) => {
      const note = currentNote();
      if (!note) return;
      note.title = e.target.value;
      note.updated = Date.now();
      els.crumbTitle.textContent = note.title || 'Untitled';
      scheduleSave();
      renderNotes();
      renderRightPanel();
    });

    const editor = document.createElement('textarea');
    editor.className = 'editor';
    editor.id = 'editor';
    editor.placeholder = 'Start writing…\n\nUse [[double brackets]] to link another note.';
    els.editorWrap.appendChild(editor);

    editor.addEventListener('input', (e) => {
      const note = currentNote();
      if (!note) return;
      note.body = e.target.value;
      note.updated = Date.now();
      els.updatedLabel.textContent = `Updated ${formatTime(note.updated)}`;
      scheduleSave();
      renderNotes();
      renderRightPanel();
      updateStats(note.body || '');
    });

    document.getElementById('favoriteToggle').addEventListener('click', () => {
      const note = currentNote();
      if (!note) return;
      note.favorite = !note.favorite;
      scheduleSave();
      renderNotes();
      renderEditor();
    });

    document.getElementById('copyLinkBtn').addEventListener('click', async () => {
      const note = currentNote();
      if (!note) return;
      const url = `${location.origin}${location.pathname}#${note.id}`;
      try {
        await navigator.clipboard.writeText(url);
        els.saveState.textContent = 'Link copied';
      } catch {
        els.saveState.textContent = 'Unable to copy';
      }
    });

    document.getElementById('addFolderBtn').addEventListener('click', () => {
      const name = prompt('Folder name:', 'New folder');
      if (!name) return;
      const value = name.trim();
      if (!value || state.folders.includes(value)) return;
      state.folders.push(value);
      newNote('Untitled', value, '');
    });

    document.getElementById('graphBtn').addEventListener('click', () => {
      const note = currentNote();
      if (!note) return;
      alert('Graph view is a lightweight concept view; this single-file HTML version keeps the workspace simple and portable for OneCompiler.');
    });

    function restoreSelectionFromHash() {
      const hash = location.hash.replace('#', '');
      if (hash && state.notes.some(note => note.id === hash)) {
        selectedId = hash;
      }
    }

    restoreSelectionFromHash();
    renderAll();

    if (selectedId) {
      const note = currentNote();
      if (note) {
        editor.value = note.body || '';
      }
    }
  </script>
</body>
</html>
