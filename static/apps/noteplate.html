<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111116">
  <title>NotePlate — Your personal knowledge space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    :root {
      --color-overlay: #000000;
      --color-danger: #c95e69;
      --color-primary: #e6aa62;
      --color-primary-contrast: #21180f;
      --color-bg: #111116;
      --color-surface: #19191f;
      --color-text: #e9e7ef;
      --color-muted: #92909c;
      --color-border: #2c2b34;
      --color-surface-raised: #202027;
      --color-surface-soft: #24232c;
      --font-heading: 'Inter', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: 14px;
    }

    button,
    input,
    textarea {
      color: inherit;
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 252px minmax(0, 1fr);
    }

    .sidebar {
      height: 100vh;
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      padding: 18px 12px 12px;
      z-index: 5;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 9px 21px;
    }

    .brand {
      display: flex;
      gap: 10px;
      align-items: center;
      font-weight: 700;
      letter-spacing: -.04em;
      font-size: 16px;
    }

    .brand-mark {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--color-primary-contrast);
      background: var(--color-primary);
      font-family: var(--font-heading);
      font-size: 17px;
    }

    .icon-btn {
      border: 0;
      background: transparent;
      border-radius: var(--radius);
      color: var(--color-muted);
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      font-size: 16px;
    }

    .icon-btn:hover,
    .small-action:hover {
      background: var(--color-surface-soft);
      color: var(--color-text);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 9px;
      height: 38px;
      padding: 0 10px;
      margin: 0 3px 13px;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      color: var(--color-muted);
    }

    .search-box input {
      min-width: 0;
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 12px;
    }

    .search-box input::placeholder {
      color: var(--color-muted);
    }

    .shortcut {
      font-size: 10px;
      border: 1px solid var(--color-border);
      border-radius: 5px;
      padding: 2px 5px;
      white-space: nowrap;
    }

    .nav-list {
      display: grid;
      gap: 3px;
      padding: 0 3px 15px;
      border-bottom: 1px solid var(--color-border);
    }

    .note-browser {
      padding: 12px 3px 8px;
      border-bottom: 1px solid var(--color-border);
    }

    .note-browser .section-heading {
      padding: 4px 8px 8px;
    }

    .note-list {
      display: grid;
      gap: 2px;
      max-height: 220px;
      overflow: auto;
    }

    .note-list-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--color-muted);
      text-align: left;
      transition: background .16s ease, color .16s ease, transform .16s ease;
    }

    .note-list-item:hover,
    .note-list-item.selected {
      background: var(--color-surface-soft);
      color: var(--color-text);
    }

    .note-list-item:active {
      transform: scale(.985);
    }

    .note-list-copy {
      min-width: 0;
      flex: 1;
    }

    .note-list-copy strong,
    .note-list-copy small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .note-list-copy strong {
      font-size: 11px;
      font-weight: 500;
    }

    .note-list-copy small {
      margin-top: 3px;
      color: var(--color-muted);
      font-size: 9px;
    }

    .note-list-empty {
      padding: 8px;
      color: var(--color-muted);
      font-size: 10px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      height: 36px;
      border: 0;
      border-radius: 9px;
      padding: 0 10px;
      color: var(--color-muted);
      background: transparent;
      text-align: left;
      font-size: 12px;
    }

    .nav-item:hover,
    .nav-item.active {
      background: var(--color-surface-soft);
      color: var(--color-text);
    }

    .nav-item.active .nav-icon {
      color: var(--color-primary);
    }

    .nav-icon {
      width: 17px;
      text-align: center;
      font-size: 15px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 19px 8px 8px;
      color: var(--color-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .section-heading button {
      border: 0;
      background: none;
      color: var(--color-muted);
      font-size: 18px;
      line-height: 1;
    }

    .folder-list {
      overflow: auto;
      flex: 1;
    }

    .folder-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 33px;
      border-radius: 8px;
      padding: 0 8px;
      color: var(--color-muted);
      cursor: pointer;
      font-size: 12px;
    }

    .folder-row:hover,
    .folder-row.selected {
      background: var(--color-surface-soft);
      color: var(--color-text);
    }

    .folder-row .count {
      margin-left: auto;
      color: var(--color-muted);
      font-size: 10px;
    }

    .folder-notes {
      margin-left: 19px;
      border-left: 1px solid var(--color-border);
      padding-left: 8px;
    }

    .folder-note {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      display: block;
      width: 100%;
      padding: 6px 8px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      text-align: left;
      color: var(--color-muted);
      font-size: 11px;
    }

    .folder-note:hover {
      color: var(--color-text);
      background: var(--color-surface-soft);
    }

    .sidebar-bottom {
      border-top: 1px solid var(--color-border);
      padding-top: 10px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 6px 3px;
      color: var(--color-muted);
      font-size: 11px;
    }

    .avatar {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: color-mix(in srgb, var(--color-primary) 24%, var(--color-surface));
      color: var(--color-primary);
      font-weight: 700;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      height: 54px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 26px;
      border-bottom: 1px solid var(--color-border);
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--color-muted);
      font-size: 11px;
    }

    .breadcrumbs strong {
      color: var(--color-text);
      font-weight: 500;
    }

    .top-actions {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .small-action {
      height: 31px;
      min-width: 31px;
      padding: 0 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: transparent;
      border: 0;
      border-radius: 8px;
      color: var(--color-muted);
      font-size: 11px;
    }

    .save-state {
      color: var(--color-muted);
      font-size: 10px;
      margin-right: 9px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 248px;
      flex: 1;
      min-height: 0;
    }

    .editor-area {
      min-width: 0;
      overflow: auto;
      position: relative;
    }

    .editor-wrap {
      max-width: 790px;
      margin: 0 auto;
      padding: 53px 64px 90px;
    }

    .note-eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--color-muted);
      font-size: 10px;
    }

    .favorite-toggle {
      margin-left: auto;
      border: 0;
      border-radius: 7px;
      padding: 4px 7px;
      background: transparent;
      color: var(--color-primary);
      font-size: 17px;
      line-height: 1;
      transition: background .16s ease, transform .16s ease;
    }

    .favorite-toggle:hover {
      background: var(--color-surface-soft);
      transform: scale(1.08);
    }

    .note-title {
      width: 100%;
      border: 0;
      outline: 0;
      resize: none;
      overflow: hidden;
      background: transparent;
      color: var(--color-text);
      font-family: var(--font-heading);
      font-size: 36px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -.045em;
    }

    .note-title::placeholder {
      color: color-mix(in srgb, var(--color-muted) 55%, transparent);
    }

    .note-meta {
      display: flex;
      gap: 13px;
      align-items: center;
      padding: 13px 0 18px;
      border-bottom: 1px solid var(--color-border);
      color: var(--color-muted);
      font-size: 10px;
    }

    .tag-chip {
      color: var(--color-primary);
      background: color-mix(in srgb, var(--color-primary) 12%, var(--color-surface));
      border-radius: 999px;
      padding: 4px 8px;
    }

          .editor {
      min-height: 54vh;
      width: 100%;
      padding: 22px 0;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: var(--editor-size, 14px);
      line-height: 1.9;
      tab-size: 2;
    }


    .editor::placeholder {
      color: var(--color-muted);
    }

    .markdown {
      min-height: 54vh;
      padding: 22px 0;
      line-height: 1.85;
      overflow-wrap: anywhere;
    }

    .markdown h1,
    .markdown h2,
    .markdown h3 {
      font-family: var(--font-heading);
      letter-spacing: -.03em;
      margin: 1.5em 0 .55em;
      line-height: 1.3;
    }

    .markdown h1 {
      font-size: 28px;
    }

    .markdown h2 {
      font-size: 22px;
    }

    .markdown h3 {
      font-size: 18px;
    }

    .markdown p {
      margin: .85em 0;
      color: var(--color-text);
    }

    .markdown a {
      color: var(--color-primary);
      text-decoration: none;
    }

    .markdown a:hover {
      text-decoration: underline;
    }

    .markdown ul,
    .markdown ol {
      padding-left: 24px;
    }

    .markdown li {
      margin: 5px 0;
    }

    .markdown blockquote {
      margin: 18px 0;
      padding: 4px 15px;
      border-left: 3px solid var(--color-primary);
      color: var(--color-muted);
    }

    .markdown code {
      padding: 2px 5px;
      background: var(--color-surface-soft);
      border-radius: 5px;
      font-size: .9em;
    }

    .markdown pre {
      overflow: auto;
      padding: 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
    }

    .markdown pre code {
      padding: 0;
      background: transparent;
    }

    .markdown hr {
      border: 0;
      border-top: 1px solid var(--color-border);
      margin: 25px 0;
    }

    .markdown table {
      width: 100%;
      border-collapse: collapse;
    }

    .markdown th,
    .markdown td {
      padding: 8px;
      border: 1px solid var(--color-border);
      text-align: left;
    }

    .markdown input[type=checkbox] {
      accent-color: var(--color-primary);
    }

    .right-panel {
      overflow: auto;
      border-left: 1px solid var(--color-border);
      padding: 25px 17px;
      background: color-mix(in srgb, var(--color-surface) 55%, var(--color-bg));
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      color: var(--color-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .panel-section {
      margin-bottom: 27px;
    }

    .panel-empty {
      color: var(--color-muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .link-card {
      display: block;
      width: 100%;
      margin: 4px 0;
      padding: 9px 10px;
      border: 1px solid var(--color-border);
      border-radius: 9px;
      background: var(--color-surface);
      text-align: left;
    }

    .link-card:hover {
      border-color: var(--color-primary);
    }

    .link-card strong {
      display: block;
      font-size: 11px;
      font-weight: 500;
    }

    .link-card small {
      color: var(--color-muted);
      font-size: 10px;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-button {
      background: var(--color-surface-soft);
      border: 0;
      border-radius: 999px;
      padding: 5px 8px;
      color: var(--color-muted);
      font-size: 10px;
    }

    .tag-button:hover {
      color: var(--color-primary);
    }

    .statusbar {
      height: 27px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      border-top: 1px solid var(--color-border);
      color: var(--color-muted);
      font-size: 10px;
    }

    .status-right {
      display: flex;
      gap: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 100px 25px;
      color: var(--color-muted);
    }

    .empty-state .empty-icon {
      font-size: 36px;
      color: var(--color-primary);
      margin-bottom: 15px;
    }

    .empty-state h2 {
      margin: 0 0 8px;
      color: var(--color-text);
      font-family: var(--font-heading);
      font-size: 24px;
    }

    .empty-state p {
      font-size: 12px;
      margin: 0 auto 18px;
      max-width: 320px;
      line-height: 1.6;
    }

    .primary-btn {
      padding: 9px 14px;
      border: 0;
      border-radius: 9px;
      background: var(--color-primary);
      color: var(--color-primary-contrast);
      font-weight: 600;
      font-size: 11px;
    }

    .primary-btn:hover {
      filter: brightness(1.08);
    }

    .modal-backdrop {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: start center;
      padding: 15vh 18px 30px;
      background: color-mix(in srgb, var(--color-overlay) 65%, transparent);
    }

    .modal {
      width: min(560px, 100%);
      max-height: 70vh;
      overflow: auto;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
      box-shadow: 0 24px 90px color-mix(in srgb, var(--color-overlay) 40%, transparent);
    }

    .modal-head {
      padding: 15px 17px;
      border-bottom: 1px solid var(--color-border);
    }

    .modal-head h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
    }

    .modal-head p {
      margin: 5px 0 0;
      color: var(--color-muted);
      font-size: 10px;
    }

    .modal-search {
      width: 100%;
      padding: 14px 17px;
      border: 0;
      border-bottom: 1px solid var(--color-border);
      outline: 0;
      background: transparent;
      font-size: 13px;
    }

    .modal-list {
      padding: 7px;
    }

    .modal-row {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 11px;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      text-align: left;
    }

    .modal-row:hover {
      background: var(--color-surface-soft);
    }

    .modal-row .row-copy {
      flex: 1;
      min-width: 0;
    }

    .modal-row strong {
      display: block;
      font-size: 12px;
      font-weight: 500;
    }

    .modal-row small {
      display: block;
      overflow: hidden;
      max-width: 100%;
      margin-top: 3px;
      color: var(--color-muted);
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 10px;
    }

    .modal-row kbd {
      color: var(--color-muted);
      font-size: 10px;
    }

    .graph-wrap {
      padding: 16px;
    }

    .graph-svg {
      width: 100%;
      height: 390px;
      background: var(--color-bg);
      border-radius: 9px;
    }

    .graph-svg line {
      stroke: var(--color-border);
      stroke-width: 1.5;
    }

    .graph-svg circle {
      fill: var(--color-primary);
      stroke: var(--color-bg);
      stroke-width: 3;
      cursor: pointer;
    }

    .graph-svg text {
      fill: var(--color-text);
      font-family: var(--font-body);
      font-size: 10px;
      text-anchor: middle;
      pointer-events: none;
    }

    .settings {
      padding: 17px;
      display: grid;
      gap: 15px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .setting-row strong {
      display: block;
      font-size: 12px;
      font-weight: 500;
    }

    .setting-row small {
      display: block;
      margin-top: 3px;
      color: var(--color-muted);
      font-size: 10px;
    }

    .setting-row select,
    .setting-row input[type=number] {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 7px 9px;
    }

    .toggle {
      accent-color: var(--color-primary);
      width: 15px;
      height: 15px;
    }

    .toast {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      padding: 10px 15px;
      border: 1px solid var(--color-border);
      border-radius: 9px;
      background: var(--color-surface-raised);
      color: var(--color-text);
      box-shadow: 0 8px 25px color-mix(in srgb, var(--color-overlay) 25%, transparent);
      font-size: 11px;
    }

    .mobile-menu {
      display: none;
    }

    button,
    select,
    input,
    textarea {
      transition: border-color .16s ease, background-color .16s ease, color .16s ease;
    }

    :focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .folder-row,
    .link-card,
    .nav-item,
    .tag-button,
    .small-action,
    .icon-btn,
    .primary-btn {
      transition: background .16s ease, color .16s ease, border-color .16s ease, transform .16s ease;
    }

    .modal-backdrop {
      animation: fade-in .16s ease-out;
    }

    .modal {
      animation: modal-in .2s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modal-in {
      from { opacity: 0; transform: translateY(10px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    [data-theme="light"] {
      --color-bg: #f8f5ef;
      --color-surface: #fffdf9;
      --color-text: #302a22;
      --color-muted: #82786c;
      --color-border: #e9e1d5;
      --color-surface-raised: #fffdf9;
      --color-surface-soft: #f3ede3;
    }

    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: minmax(0, 1fr);
      }

      .right-panel {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 260px;
        transform: translateX(-102%);
        transition: transform .2s ease;
        box-shadow: none;
      }

      .sidebar.open {
        transform: translateX(0);
        box-shadow: 10px 0 40px color-mix(in srgb, var(--color-overlay) 35%, transparent);
      }

      .topbar {
        padding: 0 12px;
      }

      .mobile-menu {
        display: grid;
      }

      .editor-wrap {
        padding: 35px 22px 70px;
      }

      .note-title {
        font-size: 30px;
      }

      .top-actions .hide-mobile {
        display: none;
      }
    }

  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <div class="brand"><span class="brand-mark">✦</span><span>NotePlate</span></div>
        <button class="icon-btn" id="sidebarAdd" title="New note (Ctrl+N)">＋</button>
      </div>
      <label class="search-box" aria-label="Search notes"><span>⌕</span><input id="searchInput" placeholder="Search your notes..." autocomplete="off"><span class="shortcut">⌘ K</span></label>
      <nav class="nav-list">
        <button class="nav-item active" data-view="all"><span class="nav-icon">▤</span>All notes <span class="count" id="allCount"></span></button>
        <button class="nav-item" data-view="recent"><span class="nav-icon">◷</span>Recently edited</button>
        <button class="nav-item" data-view="starred"><span class="nav-icon">☆</span>Starred notes</button>
        <button class="nav-item" id="dailyBtn"><span class="nav-icon">▦</span>Daily note</button>
        <button class="nav-item" id="graphBtn"><span class="nav-icon">⌘</span>Graph view</button>
      </nav>
      <section class="note-browser" aria-label="Note list">
        <div class="section-heading"><span id="noteListHeading">Notes</span></div>
        <div class="note-list" id="noteList"></div>
      </section>
      <div class="section-heading"><span>Folders</span><button id="addFolderBtn" title="New folder">＋</button></div>
      <div class="folder-list" id="folderList"></div>
      <div class="sidebar-bottom">
        <button class="nav-item" id="settingsBtn"><span class="nav-icon">⚙</span>Settings</button>
        <button class="nav-item" id="exportBtn"><span class="nav-icon">⇩</span>Export workspace</button>
        <label class="nav-item" for="importInput" style="cursor:pointer"><span class="nav-icon">⇧</span>Import Markdown<input id="importInput" type="file" accept=".md,text/markdown" multiple hidden></label>
        <div class="profile"><span class="avatar">Y</span><span>Your personal workspace<br><small>Saved on this device</small></span></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="breadcrumbs"><button class="icon-btn mobile-menu" id="menuBtn">☰</button><span id="crumbFolder">Workspace</span><span>/</span><strong id="crumbTitle">Welcome</strong></div>
        <div class="top-actions"><span class="save-state" id="saveState">All changes saved</span><button class="small-action hide-mobile" id="viewToggle" title="Toggle reading view">◉ <span>Preview</span></button><button class="small-action hide-mobile" id="copyLinkBtn" title="Copy note link">↗</button><button class="small-action" id="moreBtn" title="More actions">···</button></div>
      </header>
      <section class="workspace">
        <div class="editor-area" id="editorArea"></div>
        <aside class="right-panel" id="rightPanel"></aside>
      </section>
      <footer class="statusbar"><span id="statusWords">0 words</span><span class="status-right"><span id="statusLinks">0 links</span><span>Markdown</span><span>UTF-8</span></span></footer>
    </main>
  </div>
  <div id="overlayRoot"></div>
  <script>
    (() => {
      const STORAGE_KEY = 'lumen-personal-knowledge-v1';
      const LEGACY_STORAGE_KEY = 'obsidian-vibecode-vault-v1';
      const starterNotes = [{
          id: 'welcome',
          title: 'Welcome to NotePlate',
          folder: 'Getting Started',
          body: '# Welcome to NotePlate\n\nWelcome to NotePlate, your personal knowledge space. Everything you write is saved **privately in this browser**. Start by making a note, connecting ideas, and finding your own flow.\n\n## Make connections\n\nLink ideas together with double brackets, like [[Quick Start Guide]] or [[Ideas worth exploring]]. A linked note becomes part of a living web of knowledge.\n\n## A few things to try\n\n- Press **Ctrl / ⌘ + N** to create a note\n- Use `[[note title]]` to connect notes\n- Add `#tags` anywhere in your writing\n- Press **Ctrl / ⌘ + K** to search your workspace\n- Open the graph view to see your notes as a constellation\n\n> Your notes belong to you. Use **Export workspace** to download a backup at any time.\n\n---\n\nHappy thinking. ✨',
          created: Date.now() - 10000,
          updated: Date.now() - 5000
        },
        {
          id: 'quick-start',
          title: 'Quick Start Guide',
          folder: 'Getting Started',
          body: '# Quick Start Guide\n\nA few small habits make a big difference.\n\n## Capture first, organize later\n\nCreate a note whenever an idea appears. Give it a clear title and write freely. Your workspace is searchable, so you do not need the perfect folder right away.\n\n## Link your thinking\n\nWhen a note reminds you of another, connect them: [[Welcome to NotePlate]]. Links make it easy to follow ideas across topics.\n\n## Use tags\n\nTags like #reading, #project, or #question are lightweight labels. You can click any tag in the side panel to find related notes.\n\n## Make it yours\n\nTry a daily note, change the theme in Settings, or import your existing Markdown files.',
          created: Date.now() - 9000,
          updated: Date.now() - 4000
        },
        {
          id: 'ideas',
          title: 'Ideas worth exploring',
          folder: 'Personal',
          body: '# Ideas worth exploring\n\nA little space for thoughts that might become something.\n\n- What would I love to learn this year? #learning\n- A tiny tool that makes a daily task delightful #projects\n- Places to visit when the days get longer #travel\n\nConnect this note to [[Quick Start Guide]] as your ideas grow.',
          created: Date.now() - 8000,
          updated: Date.now() - 3000
        }
      ];
      const load = () => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY));
          if (saved && Array.isArray(saved.notes)) return saved;
        } catch (e) {}
        return {
          notes: starterNotes,
          folders: ['Getting Started', 'Personal'],
          theme: 'dark',
          fontSize: 14
        };
      };
      let vault = load(),
        selectedId = vault.notes[0]?.id || null,
        activeView = 'all',
        folderFilter = null,
        isPreview = false,
        saveTimer = null,
        searchTerm = '';
      const $ = id => document.getElementById(id);
      const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      } [c]));
      const current = () => vault.notes.find(n => n.id === selectedId);
      const fmtDate = t => new Intl.DateTimeFormat(undefined, {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      }).format(new Date(t));
      const persist = () => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(vault));
        $('saveState').textContent = 'All changes saved';
      };
      const toast = msg => {
        const old = document.querySelector('.toast');
        if (old) old.remove();
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        document.body.append(el);
        setTimeout(() => el.remove(), 2200);
      };
      const idFrom = title => title.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'untitled';
      const tagsFor = body => [...new Set((body.match(/(^|\s)#([\w/-]+)/g) || []).map(t => t.trim().slice(1)))];

      function filteredNotes() {
        let notes = [...vault.notes];
        if (activeView === 'recent') notes.sort((a, b) => b.updated - a.updated);
        if (activeView === 'starred') notes = notes.filter(n => n.favorite);
        if (folderFilter) notes = notes.filter(n => n.folder === folderFilter);
        if (searchTerm) {
          const q = searchTerm.toLowerCase();
          notes = notes.filter(n => (n.title + ' ' + n.body + ' ' + n.folder).toLowerCase().includes(q));
        }
        return notes;
      }

      function renderNoteList() {
        const notes = filteredNotes();
        const headings = { all: 'Notes', recent: 'Recently edited', starred: 'Starred notes' };
        $('noteListHeading').textContent = folderFilter || headings[activeView] || 'Notes';
        $('noteList').innerHTML = notes.map(n => `<button class="note-list-item ${n.id===selectedId?'selected':''}" data-note="${esc(n.id)}"><span>${n.favorite?'★':'▤'}</span><span class="note-list-copy"><strong>${esc(n.title||'Untitled')}</strong><small>${esc(n.folder||'Unfiled')} · ${fmtDate(n.updated)}</small></span></button>`).join('') || '<div class="note-list-empty">No notes here yet.</div>';
      }

      function renderFolders() {
        renderNoteList();
        const folders = [...new Set([...vault.folders, ...vault.notes.map(n => n.folder).filter(Boolean)])].sort((a, b) => a.localeCompare(b));
        $('folderList').innerHTML = folders.map(f => {
          const notes = vault.notes.filter(n => n.folder === f);
          return `<div class="folder-row ${folderFilter===f?'selected':''}" data-folder="${esc(f)}"><span>▸</span><span>▣</span><span>${esc(f)}</span><span class="count">${notes.length}</span></div><div class="folder-notes">${notes.map(n=>`<button class="folder-note" data-note="${esc(n.id)}" title="${esc(n.title)}">${esc(n.title||'Untitled')}</button>`).join('')}</div>`;
        }).join('') || '<div class="panel-empty" style="padding:8px">No folders yet. Add one with ＋</div>';
        $('allCount').textContent = vault.notes.length;
      }

      function safeMarkdown(body) {
        let raw = esc(body).replace(/\[\[([^\]]+)\]\]/g, (_, name) => `<a href="#" class="wiki-link" data-wiki="${encodeURIComponent(name.trim())}">${esc(name.trim())}</a>`);
        let html = window.marked ? marked.parse(raw, {
          gfm: true,
          breaks: false
        }) : `<p>${raw.replace(/\n/g,'<br>')}</p>`;
        return window.DOMPurify ? DOMPurify.sanitize(html, {
          ADD_ATTR: ['data-wiki']
        }) : html;
      }

      function noteView() {
        const note = current();
        if (!note) {
          $('editorArea').innerHTML = `<div class="empty-state"><div class="empty-icon">✳</div><h2>Your workspace is ready</h2><p>Create your first note and let your ideas find their way to each other.</p><button class="primary-btn" id="emptyNew">＋ Create a note</button></div>`;
          $('crumbTitle').textContent = 'No note selected';
          $('rightPanel').innerHTML = '';
          $('statusWords').textContent = '0 words';
          $('statusLinks').textContent = '0 links';
          return;
        }
        const words = note.body.trim() ? note.body.trim().split(/\s+/).length : 0;
        const links = (note.body.match(/\[\[([^\]]+)\]\]/g) || []).length;
        const tags = tagsFor(note.body);
        $('crumbFolder').textContent = note.folder || 'Workspace';
        $('crumbTitle').textContent = note.title || 'Untitled';
        $('statusWords').textContent = `${words} ${words===1?'word':'words'}`;
        $('statusLinks').textContent = `${links} ${links===1?'link':'links'}`;
        $('editorArea').innerHTML = `<div class="editor-wrap"><div class="note-eyebrow"><span>✎</span><span>${esc(note.folder||'Unfiled')}</span><span>·</span><span>Edited ${fmtDate(note.updated)}</span><button class="favorite-toggle" data-favorite="${esc(note.id)}" aria-label="${note.favorite?'Remove from':'Add to'} starred notes" title="${note.favorite?'Unstar note':'Star note'}">${note.favorite?'★':'☆'}</button></div><textarea class="note-title" id="noteTitle" rows="1" placeholder="Untitled">${esc(note.title)}</textarea><div class="note-meta"><span>Created ${fmtDate(note.created)}</span>${tags.map(t=>`<button class="tag-chip" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')}</div>${isPreview?`<article class="markdown" id="markdownBody">${safeMarkdown(note.body)}</article>`:`<textarea class="editor" id="noteBody" placeholder="Start writing...\n\nUse [[double brackets]] to link another note.">${esc(note.body)}</textarea>`}</div>`;
        if (!isPreview) {
          $('noteTitle').addEventListener('input', e => {
            note.title = e.target.value;
            note.updated = Date.now();
            $('crumbTitle').textContent = note.title || 'Untitled';
            $('saveState').textContent = 'Saving…';
            scheduleSave();
          });
          $('noteTitle').addEventListener('keydown', e => {
            if (e.key === 'Enter') {
              e.preventDefault();
              $('noteBody')?.focus();
            }
          });
          $('noteBody').addEventListener('input', e => {
            note.body = e.target.value;
            note.updated = Date.now();
            $('saveState').textContent = 'Saving…';
            updateStatus(note);
            scheduleSave();
          });
          $('noteBody').addEventListener('keydown', handleEditorKeys);
        }
        $('rightPanel').innerHTML = renderRightPanel(note, tags);
        renderFolders();
      }

      function updateStatus(note) {
        const body = note.body.trim();
        $('statusWords').textContent = `${body?body.split(/\s+/).length:0} ${body.split(/\s+/).length===1?'word':'words'}`;
        $('statusLinks').textContent = `${(note.body.match(/\[\[([^\]]+)\]\]/g)||[]).length} links`;
      }

      function renderRightPanel(note, tags) {
        const names = [...note.body.matchAll(/\[\[([^\]]+)\]\]/g)].map(m => m[1].trim());
        const backlinks = vault.notes.filter(n => n.id !== note.id && new RegExp(`\\[\\[${note.title.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\]\\]`, 'i').test(n.body));
        return `<section class="panel-section"><div class="panel-title">Outgoing links <span>${names.length}</span></div>${names.length?names.map(name=>{const target=vault.notes.find(n=>n.title.toLowerCase()===name.toLowerCase());return `<button class="link-card" data-open-name="${esc(name)}"><strong>${target?'↗':'＋'} ${esc(name)}</strong><small>${target?esc(target.folder||'Unfiled'):'Click to create this note'}</small></button>`;}).join(''):'<div class="panel-empty">Links you add with [[double brackets]] appear here.</div>'}</section><section class="panel-section"><div class="panel-title">Backlinks <span>${backlinks.length}</span></div>${backlinks.length?backlinks.map(n=>`<button class="link-card" data-note="${esc(n.id)}"><strong>↙ ${esc(n.title)}</strong><small>${esc(n.folder||'Unfiled')}</small></button>`).join(''):'<div class="panel-empty">No notes link here yet. Connected ideas will show up here.</div>'}</section><section class="panel-section"><div class="panel-title">Tags <span>${tags.length}</span></div>${tags.length?`<div class="tag-list">${tags.map(t=>`<button class="tag-button" data-tag="${esc(t)}"># ${esc(t)}</button>`).join('')}</div>`:'<div class="panel-empty">Add #tags anywhere in your note to collect related ideas.</div>'}</section><section class="panel-section"><div class="panel-title">Note info</div><div class="panel-empty">Created ${fmtDate(note.created)}<br>Updated ${fmtDate(note.updated)}<br>${note.body.length} characters</div></section>`;
      }

      function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          persist();
          renderFolders();
          if (current()) $('rightPanel').innerHTML = renderRightPanel(current(), tagsFor(current().body));
        }, 400);
      }

      function newNote(title = 'Untitled', body = '', folder = folderFilter || 'Personal') {
        let actual = title,
          id = idFrom(actual),
          i = 2;
        while (vault.notes.some(n => n.id === id)) {
          actual = `${title} ${i++}`;
          id = idFrom(actual);
        }
        const now = Date.now();
        const n = {
          id,
          title: actual,
          folder,
          body,
          created: now,
          updated: now
        };
        vault.notes.unshift(n);
        vault.folders = [...new Set([...vault.folders, folder])];
        selectedId = id;
        activeView = 'all';
        folderFilter = null;
        isPreview = false;
        persist();
        renderAll();
        setTimeout(() => $('noteTitle')?.focus(), 0);
        return n;
      }

      function openNote(id) {
        selectedId = id;
        isPreview = false;
        renderAll();
        if (innerWidth <= 640) $('sidebar').classList.remove('open');
      }

      function renderAll() {
        renderFolders();
        noteView();
        document.querySelectorAll('.nav-item[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === activeView));
      }

      function handleEditorKeys(e) {
        if (e.key === 'Tab') {
          e.preventDefault();
          const a = e.target.selectionStart,
            b = e.target.selectionEnd;
          e.target.value = e.target.value.slice(0, a) + '  ' + e.target.value.slice(b);
          e.target.selectionStart = e.target.selectionEnd = a + 2;
          e.target.dispatchEvent(new Event('input'));
        }
      }

      function createDaily() {
        const d = new Date(),
          title = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        let n = vault.notes.find(x => x.title === title);
        if (!n) n = newNote(title, `# ${title}\n\n## Focus\n\n- \n\n## Notes\n\n\n## Reflection\n\n`, 'Daily Notes');
        else openNote(n.id);
      }

      function openLink(name) {
        const existing = vault.notes.find(n => n.title.toLowerCase() === name.toLowerCase());
        if (existing) openNote(existing.id);
        else newNote(name, `# ${name}\n\n`);
      }

      function showModal(title, subtitle, body) {
        $('overlayRoot').innerHTML = `<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${body}</div></div>`;
        $('backdrop').addEventListener('click', e => {
          if (e.target.id === 'backdrop') closeModal();
        });
        document.addEventListener('keydown', modalEscape, {
          once: true
        });
      }

      function modalEscape(e) {
        if (e.key === 'Escape') closeModal();
      }

      function closeModal() {
        $('overlayRoot').innerHTML = '';
      }

      function showSearch() {
        showModal('Search your workspace', 'Find a note by title, folder, or anything you remember writing.', `<input class="modal-search" id="modalSearch" placeholder="Type to search…" autofocus><div class="modal-list" id="modalResults"></div>`);
        const input = $('modalSearch');
        const update = () => {
          const q = input.value.toLowerCase();
          let items = vault.notes.filter(n => !q || (n.title + ' ' + n.folder + ' ' + n.body).toLowerCase().includes(q)).slice(0, 12);
          $('modalResults').innerHTML = items.map(n => `<button class="modal-row" data-note="${esc(n.id)}"><span>▤</span><span class="row-copy"><strong>${esc(n.title||'Untitled')}</strong><small>${esc(n.folder||'Unfiled')} · ${esc(n.body.slice(0,75).replace(/\n/g,' '))}</small></span><kbd>↵</kbd></button>`).join('') || '<div class="panel-empty" style="padding:14px">No matching notes.</div>';
        };
        input.addEventListener('input', update);
        update();
        setTimeout(() => input.focus(), 30);
      }

      function showGraph() {
        const notes = vault.notes.slice(0, 45);
        const width = 700,
          height = 390,
          cx = 350,
          cy = 190;
        const positions = notes.map((n, i) => {
          const angle = (i / Math.max(notes.length, 1)) * Math.PI * 2;
          const radius = notes.length < 3 ? 0 : Math.min(142, 45 + notes.length * 3);
          return {
            x: cx + Math.cos(angle) * radius,
            y: cy + Math.sin(angle) * radius,
            n
          };
        });
        const links = [];
        positions.forEach(p => {
          [...p.n.body.matchAll(/\[\[([^\]]+)\]\]/g)].forEach(m => {
            const target = positions.find(x => x.n.title.toLowerCase() === m[1].trim().toLowerCase());
            if (target) links.push(`<line x1="${p.x}" y1="${p.y}" x2="${target.x}" y2="${target.y}"/>`);
          });
        });
        const nodes = positions.map(p => `<g data-node="${esc(p.n.id)}"><circle cx="${p.x}" cy="${p.y}" r="6"/><text x="${p.x}" y="${p.y+19}">${esc(p.n.title.slice(0,20))}</text></g>`).join('');
        showModal('Your knowledge graph', 'Each dot is a note. Lines are connections made with [[wiki-links]].', `<div class="graph-wrap"><svg class="graph-svg" viewBox="0 0 ${width} ${height}" role="img">${links.join('')}${nodes}</svg><div class="panel-empty" style="padding:12px 4px 0">${notes.length} notes · ${links.length} connections</div></div>`);
      }

      function showSettings() {
        showModal('Settings', 'Make this space feel like yours.', `<div class="settings"><div class="setting-row"><span><strong>Appearance</strong><small>Choose your workspace theme</small></span><select id="themeSelect"><option value="dark">Dark</option><option value="light">Light</option></select></div><div class="setting-row"><span><strong>Editor text size</strong><small>Comfortable reading and writing</small></span><select id="fontSize"><option value="13">Small</option><option value="14">Default</option><option value="16">Large</option><option value="18">Extra large</option></select></div><div class="setting-row"><span><strong>Word count</strong><small>Shown in the bottom status bar</small></span><span>Always on</span></div><div style="padding-top:10px;border-top:1px solid var(--color-border)"><button class="small-action" id="deleteAllBtn" style="color:var(--color-danger)">Delete all notes…</button></div></div>`);
        $('themeSelect').value = vault.theme || 'dark';
        $('fontSize').value = vault.fontSize || 14;
        document.documentElement.dataset.theme = vault.theme || 'dark';
        $('themeSelect').onchange = e => {
          vault.theme = e.target.value;
          document.documentElement.dataset.theme = vault.theme;
          persist();
        };
        $('fontSize').onchange = e => {
          vault.fontSize = Number(e.target.value);
          document.documentElement.style.setProperty('--editor-size', `${vault.fontSize}px`);
          document.querySelectorAll('.editor').forEach(x => x.style.fontSize = `${vault.fontSize}px`);
          persist();
        };
      }

      function showMore() {
        const n = current();
        if (!n) return;
        showModal('Note actions', n.title, `<div class="modal-list"><button class="modal-row" id="renameAction"><span>✎</span><span class="row-copy"><strong>Rename note</strong><small>Change this note’s title</small></span></button><button class="modal-row" id="moveAction"><span>▣</span><span class="row-copy"><strong>Move to folder</strong><small>Organize your workspace</small></span></button><button class="modal-row" id="duplicateAction"><span>▧</span><span class="row-copy"><strong>Duplicate note</strong><small>Make a copy to edit</small></span></button><button class="modal-row" id="deleteAction"><span>⌫</span><span class="row-copy"><strong>Delete note</strong><small>Remove this note from your workspace</small></span></button></div>`);
        $('renameAction').onclick = () => {
          closeModal();
          $('noteTitle').focus();
          $('noteTitle').select();
        };
        $('moveAction').onclick = () => {
          closeModal();
          showMove(n);
        };
        $('duplicateAction').onclick = () => {
          closeModal();
          newNote(n.title + ' copy', n.body, n.folder);
          toast('Note duplicated');
        };
        $('deleteAction').onclick = () => {
          closeModal();
          confirmDelete(n);
        };
      }

      function showMove(n) {
        showModal('Move note', 'Choose a folder for “' + esc(n.title) + '”.', `<div class="modal-list">${[...new Set([...vault.folders,'Unfiled'])].map(f=>`<button class="modal-row" data-move="${esc(f)}"><span>▣</span><span class="row-copy"><strong>${esc(f)}</strong><small>${vault.notes.filter(x=>x.folder===f).length} notes</small></span></button>`).join('')}<button class="modal-row" id="newFolderMove"><span>＋</span><span class="row-copy"><strong>New folder…</strong></span></button></div>`);
        document.querySelectorAll('[data-move]').forEach(b => b.onclick = () => {
          n.folder = b.dataset.move === 'Unfiled' ? '' : b.dataset.move;
          vault.folders = [...new Set([...vault.folders, n.folder].filter(Boolean))];
          n.updated = Date.now();
          persist();
          closeModal();
          renderAll();
          toast('Note moved');
        });
        $('newFolderMove').onclick = () => {
          const f = prompt('New folder name');
          if (f?.trim()) {
            vault.folders.push(f.trim());
            n.folder = f.trim();
            persist();
            closeModal();
            renderAll();
          }
        };
      }

      function confirmDelete(n) {
        showModal('Delete this note?', 'This action cannot be undone.', `<div class="settings"><p class="panel-empty">“${esc(n.title)}” will be removed from this device.</p><div style="display:flex;justify-content:flex-end;gap:8px"><button class="small-action" id="cancelDelete">Cancel</button><button class="primary-btn" id="confirmDelete" style="background:var(--color-danger)">Delete note</button></div></div>`);
        $('cancelDelete').onclick = closeModal;
        $('confirmDelete').onclick = () => {
          vault.notes = vault.notes.filter(x => x.id !== n.id);
          selectedId = vault.notes[0]?.id || null;
          persist();
          closeModal();
          renderAll();
          toast('Note deleted');
        };
      }

      function exportVault() {
        const files = vault.notes.map(n => `# ${n.title}\n\n${n.body}\n`).join('\n\n<!-- ────────────── -->\n\n');
        const blob = new Blob([files], {
          type: 'text/markdown'
        });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'noteplate-notes.md';
        a.click();
        URL.revokeObjectURL(a.href);
        toast('NotePlate workspace exported as Markdown');
      }

      function importFiles(files) {
        [...files].forEach(file => {
          const reader = new FileReader();
          reader.onload = () => {
            let text = String(reader.result || '');
            let title = file.name.replace(/\.md$/i, '');
            const heading = text.match(/^#\s+(.+)$/m);
            if (heading) {
              title = heading[1].trim();
              text = text.replace(heading[0], '').replace(/^\s*\n/, '');
            }
            newNote(title, text, 'Imported');
          };
          reader.readAsText(file);
        });
      }
      $('sidebarAdd').onclick = () => newNote();
      $('dailyBtn').onclick = createDaily;
      $('graphBtn').onclick = showGraph;
      $('settingsBtn').onclick = showSettings;
      $('exportBtn').onclick = exportVault;
      $('moreBtn').onclick = showMore;
      $('searchInput').addEventListener('input', e => {
        searchTerm = e.target.value;
        activeView = 'all';
        folderFilter = null;
        renderFolders();
      });
      $('searchInput').addEventListener('focus', () => {});
      $('addFolderBtn').onclick = () => {
        const f = prompt('Name your new folder');
        if (f?.trim()) {
          vault.folders = [...new Set([...vault.folders, f.trim()])];
          persist();
          renderFolders();
          toast('Folder created');
        }
      };
      $('viewToggle').onclick = () => {
        if (!current()) return;
        isPreview = !isPreview;
        $('viewToggle').innerHTML = isPreview ? '✎ <span>Edit</span>' : '◉ <span>Preview</span>';
        noteView();
      };
      $('copyLinkBtn').onclick = () => {
        if (!current()) return;
        const text = `[[${current().title}]]`;
        navigator.clipboard?.writeText(text).then(() => toast('Wiki-link copied')).catch(() => toast(text));
      };
      $('menuBtn').onclick = () => $('sidebar').classList.toggle('open');
      $('importInput').onchange = e => {
        importFiles(e.target.files);
        e.target.value = '';
      };
      document.querySelectorAll('.nav-item[data-view]').forEach(b => b.onclick = () => {
        activeView = b.dataset.view;
        folderFilter = null;
        renderAll();
      });
      document.addEventListener('click', e => {
        const noteBtn = e.target.closest('[data-note]');
        if (noteBtn) {
          openNote(noteBtn.dataset.note);
          return;
        }
        const folder = e.target.closest('[data-folder]');
        if (folder) {
          folderFilter = folder.dataset.folder;
          activeView = 'all';
          renderAll();
          return;
        }
        const wiki = e.target.closest('[data-wiki]');
        if (wiki) {
          e.preventDefault();
          openLink(decodeURIComponent(wiki.dataset.wiki));
          return;
        }
        const openName = e.target.closest('[data-open-name]');
        if (openName) {
          openLink(openName.dataset.openName);
          closeModal();
          return;
        }
        const favorite = e.target.closest('[data-favorite]');
        if (favorite) {
          const note = vault.notes.find(n => n.id === favorite.dataset.favorite);
          if (note) {
            note.favorite = !note.favorite;
            note.updated = Date.now();
            persist();
            renderAll();
            toast(note.favorite ? 'Added to starred notes' : 'Removed from starred notes');
          }
          return;
        }
        const tag = e.target.closest('[data-tag]');
        if (tag) {
          searchTerm = '#' + tag.dataset.tag;
          $('searchInput').value = searchTerm;
          activeView = 'all';
          folderFilter = null;
          renderFolders();
          toast(`Showing notes tagged #${tag.dataset.tag}`);
          return;
        }
        if (e.target.id === 'emptyNew') newNote();
      });
      document.addEventListener('click', e => {
        const g = e.target.closest('[data-node]');
        if (g) {
          const id = g.dataset.node;
          closeModal();
          openNote(id);
        }
      });
      $('searchInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          showSearch();
          const s = $('modalSearch');
          s.value = e.target.value;
          s.dispatchEvent(new Event('input'));
        }
      });
      document.addEventListener('keydown', e => {
        const mod = e.metaKey || e.ctrlKey;
        if (mod && e.key.toLowerCase() === 'n') {
          e.preventDefault();
          newNote();
        }
        if (mod && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          showSearch();
        }
        if (mod && e.key.toLowerCase() === 'o') {
          e.preventDefault();
          showSearch();
        }
        if (mod && e.key.toLowerCase() === 's') {
          e.preventDefault();
          persist();
          toast('All changes saved');
        }
        if (mod && e.shiftKey && e.key.toLowerCase() === 'g') {
          e.preventDefault();
          showGraph();
        }
        if (e.key === 'Escape' && innerWidth <= 640) $('sidebar').classList.remove('open');
      });
      if (vault.theme === 'light') document.documentElement.dataset.theme = 'light';
      if (vault.fontSize) document.documentElement.style.setProperty('--editor-size', `${vault.fontSize}px`);
      document.addEventListener('input', e => {
        if (e.target.id === 'noteBody' && vault.fontSize) e.target.style.fontSize = `${vault.fontSize}px`;
      });
      renderAll();
    })();

  </script>
</body>

</html>
